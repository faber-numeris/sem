openapi: 3.0.0
info:
  title: Salesforce Platform APIs
  description: "The Salesforce Platform APIs collection contains 250+ requests and example responses for the following APIs:\n\n<table><tbody><tr><td><div>Auth<br>Bulk (v1 &amp; v2)<br>Composite<br>Connect<br>CPQ<br>Einstein Prediction Service<br>Event Platform</div><div contenteditable=\"false\"><div><div><div></div></div></div><div></div></div></td><td><div>GraphQL<br>Loyalty Management<br>Metadata<br>REST<br>Subscription Management<br>Tooling<br>UI</div><div contenteditable=\"false\"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>\n\n**⚠️ Disclaimer:** this collection is not covered by Salesforce support and SLAs.\n\n## Get Started\n\nClick the button below and follow the instructions from the following sections:  \n[<img src=\"https://run.pstmn.io/button.svg\" alt=\"Run In Postman\">](https://god.gw.postman.com/run-collection/12721794-67cb9baa-e0da-4986-957e-88d8734647e2?action=collection%2Ffork&source=rip_markdown&collection-url=entityId%3D12721794-67cb9baa-e0da-4986-957e-88d8734647e2%26entityType%3Dcollection%26workspaceId%3D34382471-0c97-40e5-a206-f947271665c4)\n\n### New Salesforce Users\n\nIf you are new to Salesforce, start by obtaining a free [Developer Edition Org](https://developer.salesforce.com/signup) then, follow the rest of the instructions from this documentation.\n\nYou can also watch our [Beginner's Mind YouTube series](https://www.youtube.com/playlist?list=PLgIMQe2PKPSKJ33M6CX-VLvgax7Xptcmz) for a tour of the Salesforce Platform (the last episode focuses on APIs).\n\n### New Postman Users\n\n<table><tbody><tr><td><div><p>If you are new to Postman, complete this Trailhead project to setup the collection: <a rel=\"noreferrer noopener nofollow\" href=\"https://trailhead.salesforce.com/content/learn/projects/quick-start-connect-postman-to-salesforce\" target=\"_blank\" url=\"https://trailhead.salesforce.com/content/learn/projects/quick-start-connect-postman-to-salesforce\">Quick Start: Connect Postman to Salesforce</a>.<br></p><figure editor=\"[object Object]\"><div contenteditable=\"false\"><div><img src=\"https://res.cloudinary.com/hy4kyit2a/f_auto,fl_lossy,q_70/learn/projects/quick-start-connect-postman-to-salesforce/d281185a04fbccaf4f1d37e51a3b0049_badge.png\" alt=\"\"><div><div></div><div><div></div></div><div></div><div><div></div></div><div></div><div></div><div></div><div></div></div></div></div></figure></div><div contenteditable=\"false\"><div><div><div></div></div></div><div></div></div></td><td><div><p>If you want to learn more about Postman in general, you can also complete this optional Trailhead badge: <a rel=\"noreferrer noopener nofollow\" href=\"https://trailhead.salesforce.com/content/learn/modules/postman-api-client\" target=\"_blank\" url=\"https://trailhead.salesforce.com/content/learn/modules/postman-api-client\">Postman API Client</a>.<br></p><figure editor=\"[object Object]\"><div contenteditable=\"false\"><div><img src=\"https://res.cloudinary.com/hy4kyit2a/f_auto,fl_lossy,q_70/learn/modules/postman-api-client/c4f5ce5df16040d22df5f1cfb77af5a6_badge.png\" alt=\"\"><div><div></div><div><div></div></div><div></div><div><div></div></div><div></div><div></div><div></div><div></div></div></div></div></figure></div><div contenteditable=\"false\"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>\n\n### Regular Postman Users\n\nIf you are already familiar with Postman, here are the minimal getting started steps:\n\n1. If using Postman Web UI, follow these [steps to set up CORS](https://github.com/forcedotcom/postman-salesforce-apis/blob/master/install-with-web.md#enable-cors-in-salesforce) in your Salesforce Org. This is not required when working with the Postman Desktop app.\n\n2. Assign a value to the `url` collection variable based on your Salesforce Org type:\n    \n    | URL | Org Type |\n    | --- | --- |\n    | `https://test.salesforce.com` | Sandboxes or Scratch orgs. |\n    | `https://login.salesforce.com` | Production, Trailhead Playground and Developer Edition orgs. |\n    | Custom My Domain base URL | Org with a custom domain. |\n    \n3. Click **Get New Access Token** from the collection's **Authorization** tab.\n    \n4. When prompted to do so, log in to your Salesforce org and allow access to \"Salesforce APIs Collection for Postman\".\n    \n5. Copy the value of the `instance_url` field from the token details view.\n    \n6. Click **Use Token**.\n    \n7. Save the value that you copied in the `_endpoint` variable.\n    \n8. Click **Save** and you're good to go!\n    \n\n## Resources\n\nCheck out [the documentation](https://github.com/forcedotcom/postman-salesforce-apis) for videos and extra information on how to install, update and contribute to the collection.\n\nWe also have an [demo video](https://www.youtube.com/watch?v=W-IwW6RM4F0) on how to setup the collection.\n\n<img src=\"https://i3.ytimg.com/vi/W-IwW6RM4F0/maxresdefault.jpg\" width=\"80%\">\n\nReport issues and ask questions [here](https://github.com/forcedotcom/postman-salesforce-apis/issues).\n\n## Variables Reference\n\nThe collection relies on the following variables:\n\n| Variable | Description |\n| --- | --- |\n| `_endpoint` | Your Salesforce Org's instance URL. |\n| `url` | The URL used for logging in. Either:  <br>\\- `https://test.salesforce.com` for sandboxes or Scratch orgs  <br>\\- `https://login.salesforce.com` for production, Trailhead Playground and Developer Edition orgs  <br>\\- your custom My Domain base URL. |\n| `version` | The Salesforce API version (e.g.: 50.0). |\n| `username` | Your username. |\n| `password` | Your password. |\n| `secretToken` | Your personal [security token](https://help.salesforce.com/articleView?id=user_security_token.htm). |\n| `clientId` | Connected App client Id. |\n| `clientSecret` | Connected App client secret. |\n| `redirectUrl` | Connected App redirect URL for OAuth 2.0. |\n| `initAccessToken` | Initial access token for dynamic Connected App registration. |\n| `site` | Community suffix when connecting with an Experience Cloud user. |\n\nOnly a few of these variables are mandatory. The authentication requests will automatically register and set extra \"private\" variables identified with a `_` prefix (e.g.: `_accessToken`, `_orgId`, `_userId`...)."
  version: '66.0'
servers:
  - url: http://localhost:9090
    description: Salesforce emulator (sem)
  - url: https://login.salesforce.com
    description: Salesforce
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    oauth2Auth:
      type: http
      scheme: oauth2
security:
  - oauth2Auth: []
tags:
  - name: Auth
    description: >-
      Use requests from this folder to obtain an Access Token.


      The authentication requests automatically fill the endpoint URL and access token environment variables for subsequent API calls.
  - name: Auth > Headless Identity API Demo
    description: "Salesforce Headless Identity gives you the ability to separate back-end authentication processes from front-end identity experiences. By calling Headless Identity APIs, you can use the power of Customer Identity for authentication while maintaining complete control over the user experience in an off-platform or third-party app.\n\nSalesforce offers three Headless Identity features: login with Headless Login API, registration with Headless Registration API, and password reset with Headless Forgot Password API. You can also link a single sign-on (SSO) provider to your headless app to create a native SSO experience.\n\n\U0001F4DA [Headless Identity Implementation Guide](https://resources.docs.salesforce.com/244/latest/en-us/sfdc/pdf/headless_identity_impl_guide.pdf)"
  - name: Auth > External Client Apps
    description: >-
      > External client apps is a packageable framework to integrate a third-party application with Salesforce using APIs and security protocols. External client apps provide single sign-on (SSO) and use OAuth protocols to authorize third-party apps. The third-party apps that are integrated with Salesforce can run on the customer success platform as well as other platforms, devices, or SaaS subscriptions. Use the credentials endpoints in this collection to get OAuth credentials for a single consumer or all consumers associated with an external client app. The OAuth usage endpoints return information about the external client apps in your org, users for an app, and tokens. OAuth usage also includes Revoke endpoints that you can use to revoke one token, all tokens by app, or all tokens by user. [External Client Apps](https://help.salesforce.com/s/articleView?id=sf.external_client_apps.htm&type=5)
  - name: Auth > External Client Apps > OAuth Usage
    description: >-
      > Get External Client App OAuth usage information and revoke tokens. These Connect API endpoints return information about the external client apps that users in your org are connecting to, a list of all OAuth users for an app, or the tokens for a given app and user. If you want to revoke access to an external client app, use the OAuth usage resources to revoke a specific token, all tokens associated with an app, or the tokens associated with a specific user. [External Client App OAuth Usage](https://help.salesforce.com/s/articleView?id=sf.external_client_app_oauth_usage.htm&type=5)
  - name: Auth > External Client Apps > Credentials
    description: >-
      > Use these Connect API endpoints to get credentials for OAuth consumers of an external client app. Collections returns credentials for all consumers associated with an external client app. Resources returns the the key, secret, or both key and secret for a specific consumer.
  - name: Bulk v1
    description: "The Bulk API provides a programmatic option to quickly load your org’s data into Salesforce. To use the API requires basic familiarity with software development, web services, and the Salesforce user interface.\n\nThe functionality described is available only if your org has the Bulk API feature enabled. This feature is enabled by default for Performance, Unlimited, Enterprise, and Developer Editions.\n\n\U0001F4DA [Bulk API Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/asynch_api_intro.htm)\n\n**Note:** All Bulk API requests except \"Create Job\" require a `_jobId` variable. This variable is automatically set by the \"Create Job\" request."
  - name: Bulk v1 > Query
  - name: Bulk v2
    description: "Bulk API 2.0 provides a simple interface to quickly load large amounts of data into your Salesforce org and to perform bulk queries on your org data.\n\nBulk API 2.0 is available in API version 41.0 and later. Query jobs in Bulk API 2.0 are available in API version 47.0 and later.\n\n\U0001F4DA [Bulk API 2.0 Documentation](https://developer.salesforce.com/docs/atlas.en-us.api_bulk_v2.meta/api_bulk_v2/introduction_bulk_api_2.htm)\n\n**Note:** All Bulk API requests except \"Create Job\" require a `_jobId` variable. This variable is automatically set by the \"Create Job\" request."
  - name: Bulk v2 > Query
  - name: Composite
    description: >-
      The Composite API executes a series of REST API requests in a single POST request, or retrieves a list of other composite resources with a GET request.


      There are three types of Composite requests sometime referred to as APIs:

      - [Composite](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_composite_composite.htm) (the original)

      - [Composite Batch](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_composite_batch.htm)

      - [Composite Graph](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_composite_graph.htm) (the most recent)
  - name: Connect
    description: "Integrate mobile apps, intranet sites, and third-party web applications with Salesforce using Connect REST API. Responses are localized, structured for presentation, and can be filtered to contain only what the app needs.\n\nConnect REST API provides programmatic access to B2B Commerce, CMS managed content, Experience Cloud sites, files, notifications, topics, and more. Use Connect REST API to display Chatter feeds, users, and groups, especially in mobile applications.\n\n\U0001F4DA [Connect REST API Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/intro_what_is_chatter_connect.htm)"
  - name: Connect > File
    description: >-
      Get information about files, including content and sharing. Post files, update files shares link.
  - name: Connect > Named Credential
    description: "Get, create, update, and delete a credential. Get the URL for the OAuth token flow for an external credential. Get external credentials.\n\n\U0001F4DA [Named Credentials Resources in the Connect REST API Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_named_credentials_resources.htm)"
  - name: Connect > Chatter
    description: >-
      Get feeds, post and delete feed elements. Get, update, and delete comments. Get groups and group members. Create groups, invites, and members. Create user photos and user messages. Get user subscription information. Delete a subscription.
  - name: Connect > Chatter > Feeds
    description: >-
      Feeds are made up of feed items. There are many feed types. Each feed type has an algorithm that determines which feed items it contains.
  - name: Connect > Chatter > Feed Elements
    description: Post and delete feed elements.
  - name: Connect > Chatter > Comments
    description: Get, edit, and delete comments.
  - name: Connect > Chatter > Groups
    description: Get groups and group members. Create groups, invites, and members.
  - name: Connect > Chatter > User
    description: Create user photos and user messages. Get user subscription information.
  - name: Connect > Industries
    description: >-
      [Industries Common Resources Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/)
  - name: Connect > Industries > Business Rules Engine
    description: "Business Rules Engine is a suite of services, components, and objects that can be used to create business rules that perform complex lookups and calculations. The key components of Business Rules Engine are expression sets, decision matrices, and decision tables.\n\n<img src=\"https://content.pstmn.io/c5600a2e-eabd-480f-ab49-a89e4721683f/U2NyZWVuc2hvdCAyMDIzLTA5LTA1IGF0IDEzLjAxLjMyLnBuZw==\" alt=\"\">\n\nSee Developers Salesforce Help Docs: [Business Rules Engine](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/business_rules_engine.htm)\n\nSee Salesforce Help Docs: [Business Rules Engine](https://help.salesforce.com/s/articleView?id=sf.business_rules_engine.htm)\n\n# Business Rules Engine Business APIs\n\nBusiness Rules Engine Connect REST APIs help customers, partners, and ISVs integrate with Salesforce software and UIs.\n\nThe runtime service for Business Rules Engine components is exposed through Connect APIs.\n\n## Sign Up for a Developer Edition Org with Business Rules Engine\n\nIf you want to practice and try out the steps, you need a special Developer Edition org that contains Business Rules Engine and our sample data. Here’s how to get the free Developer Edition now.\n\n1. Sign up for a free Developer Edition org with [<u>Business Rules Engine</u>](https://trailhead.salesforce.com/promo/orgs/business-rules-engine).\n    \n2. Fill out the form.\n    \n    1. For Email, enter an active email address.\n        \n    2. For Username, enter a username that looks like an email address and is unique. It doesn’t need to be a valid email account (for example, [yourname@hc4evah.com](https://mailto:yourname@hc4evah.com) is fine).\n        \n3. Click **Sign me up**. A confirmation message appears.\n    \n4. When you receive the activation email (this might take a few minutes), open it and click **Verify Account**.\n    \n5. Complete your registration by setting your password and challenge question.  \n    **Tip:** Write down your username, password, and login URL for easy access later.\n    \n\nYou are logged into your trial org. For more information on setting up Business Rules Engine and configuring your users, see [<u>Set Up Business Rules Engine</u>](https://help.salesforce.com/s/articleView?id=sf.set_up_business_rules_engine.htm&type=5).\n\nSpecfially this collection is designed to [answer](https://help.salesforce.com/s/articleView?id=sf.third_party_workflows.htm):\n\n<img src=\"https://content.pstmn.io/2ef103a8-6fd7-472a-af82-49402d9c63ae/U2NyZWVuc2hvdCAyMDIzLTA5LTA1IGF0IDEzLjEzLjExLnBuZw==\" alt=\"\">"
  - name: Connect > Industries > Business Rules Engine > expression-set
    description: >-
      [SALESFORCE &gt; HELP DOCS &gt; INDUSTRIES COMMON FEATURES GUIDE &gt; Expression Sets](https://help.salesforce.com/s/articleView?id=sf.expression_sets.htm)


      [SALESFORCE &gt; HELP DOCS &gt; INDUSTRIES COMMON FEATURES GUIDE &gt; Expression Sets for Developers](https://help.salesforce.com/s/articleView?id=sf.expression_sets_for_developers.htm)


      <img src="https://content.pstmn.io/59d04738-6425-4a2f-a7d1-ecab54b8a98a/U2NyZWVuc2hvdCAyMDIzLTA5LTA3IGF0IDA5LjI2LjA3LnBuZw==" alt="">
  - name: Connect > Industries > Business Rules Engine > expression-set > version
  - name: Connect > Industries > Business Rules Engine > expressionset
    description: >-
      **WATCH OUT**: expressionSet has no dash compared to the other expression set resources. Elected to create separate Postman folder to model this odity. [gjeffcock@salesforce.com](https://gjeffcock@salesforce.com)
  - name: Connect > Industries > Business Rules Engine > decision-matrices
    description: "# [Decision Matrices for Developers](https://help.salesforce.com/s/articleView?id=sf.decision_matrices_for_developers.htm)\n\nDevelopers in your Salesforce org can employ decision matrix developer resources to use and extend decision matrices.\n\n### REQUIRED EDITIONS\n\n| Available in: Lightning Experience |\n| Available in: **Enterprise**, **Unlimited**, and **Developer** Editions for Industries clouds that have Business Rules Engine enabled |\n\n## Connect REST API\n\n- [Look up decision matrices](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/connect_resources_bre_decision_matrix.htm)\n    \n- [Export decision matrix versions to DMN files](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/connect_resources_bre_decision_model_entity.htm)\n    \n\n## Metadata API\n\n- [Create decision matrices](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/meta_decisionmatrixdefinition.htm)\n    \n\n## Invocable Actions\n\n- [Invoke a decision matrix in a flow using the decision matrix action](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/actions_obj_decision_matrix.htm)"
  - name: Connect > Industries > Business Rules Engine > decision-models
  - name: Connect > Industries > Business Rules Engine > decision-table
  - name: Connect > Industries > Business Rules Engine > decision-table > lookup
  - name: Connect > Industries > Business Rules Engine > lookup-tables
    description: >-
      [<b>Lookup Tables (GET)</b>](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/connect_resources_bre_search_lookup_tables.htm)


      <img src="https://content.pstmn.io/9d1da0f6-7e11-43d0-ba2d-8de51f92a994/U2NyZWVuc2hvdCAyMDIzLTA5LTA1IGF0IDEzLjI3LjIzLnBuZw==" alt="">


      [Response Message](https://developer.salesforce.com/docs/atlas.en-us.246.0.industries_reference.meta/industries_reference/connect_responses_lookup_tables_result_list.htm)
  - name: Connect > Industries > Commerce Webstore
    description: "Get, create, update, and delete your commerce data. Work with carts, orders, products, promotions, wishlists, and search settings.\n\nThis feature requires a [specific license](https://help.salesforce.com/s/articleView?id=sf.b2b_commerce_license.htm&type=5).\n\n\U0001F4DA [B2B Commerce on Lightning Experience Resources in the Connect REST API Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_commerce.htm)"
  - name: Connect > Industries > Commerce Webstore > Cart Items
  - name: Connect > Industries > Fundraising
    description: "The Fundraising Business Process APIs empower teams to build robust integrations through industry standard tools. Instead of making multiple calls using multiple APIs to multiple objects, use our composite Fundraising BP API to send over a single, complex payload - and let us do the rest. Developer-friendly APIs do not require a detailed and complete understanding of the NPC data model, which greatly simplifies integrations. Automatic record matching, batch processing of fields, bulk support, and dynamic mapping of data to custom fields enables scalability and flexibility for customers and partners alike. Five robust endpoints are currently available to:\n\n- Create bulk gift transactions with related donor and designations\n- Create bulk gift commitments with related donor, schedule, and default designations\n- Modify the future recurring schedule on a gift commitment\n- Apply payment update metadata to gift transactions and future gift commitment installments\n    \n\nThe Fundraising Business Process APIs are available as a standard Salesforce Connect API REST endpoint as well as through Apex.\n\n\U0001F4DA [Fundraising Business APIs](https://developer.salesforce.com/docs/atlas.en-us.nonprofit_cloud.meta/nonprofit_cloud/npc_fundraising_business_api_rest_reference.htm)"
  - name: Connect > Industries > Fundraising > Gifts
  - name: Connect > Industries > Fundraising > Commitments
  - name: Connect > Einstein
  - name: Connect > Messaging
  - name: Einstein Prediction Service
    description: "After deploying models with Einstein Discovery, use the Einstein Prediction Service API to embed your predictions into any website or application.\n\n⚠️ Einstein Discovery requires either the Einstein Analytics Plus license or the Einstein Predictions license, both of which are available for an extra cost.\n\n\U0001F4DA [Einstein Prediction Service documentation](https://help.salesforce.com/articleView?id=sf.bi_edd_prediction_service.htm&type=5)."
  - name: Event Platform
    description: >-
      This folder is a collection of API requests for managing platform events, change data capture events, and event relays.
  - name: Event Platform > Custom Channels
    description: >-
      This folder contains API requests for managing custom channels for platform events and Change Data Capture.


      Channels group event messages of one or more events in one stream that a client can subscribe to. Event relays use channels to send events to Amazon EventBridge in AWS. Also, you can subscribe to channels using Streaming API (CometD) and Pub/Sub API.
  - name: Event Platform > Custom Channels > Change Data Capture
    description: >-
      To learn about channels and features for Change Data Capture, check out these resources in the _Change Data Capture Developer Guide._


      - [Compose Streams of Change Data Capture Notifications with Custom Channels](https://developer.salesforce.com/docs/atlas.en-us.change_data_capture.meta/change_data_capture/cdc_custom_channel.htm)

      - [Enrich Change Events with Extra Fields](https://developer.salesforce.com/docs/atlas.en-us.change_data_capture.meta/change_data_capture/cdc_enrich_intro.htm)

      - [Filter Your Stream of Change Events with Channels](https://developer.salesforce.com/docs/atlas.en-us.change_data_capture.meta/change_data_capture/cdc_filter_section.htm)
  - name: Event Platform > Custom Channels > Platform Event
    description: >-
      To learn about channels and features for platform events, check out these resources in the _Platform Events Developer Guide._


      - [Group Platform Events into One Stream with a Custom Channel](https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_subscribe_custom_channels.htm)

      - [Filter Your Stream of Platform Events with Custom Channels](https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_filter_section.htm)
  - name: Event Platform > Publish Platform Events
    description: >-
      This folder contains requests to publish platform event messages using REST, the REST composite resource, and SOAP API.


      To learn more about platform events, see the [Platform Events Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_intro.htm).
  - name: Event Platform > Event Relay Configuration
    description: >-
      This folder contains requests for creating an event relay and its prerequisite item, a named credential. Also, you can query the status of an event relay with EventRelayFeedback.


      For more information, see [Event Relay](https://help.salesforce.com/s/articleView?id=sf.ev_relay_intro.htm&type=5) in _Salesforce Help_.
  - name: Event Platform > Event Relay Configuration > Named Credential
    description: "This folder contains requests for creating and manipulating named credentials, which are used by event relays to store AWS account information.  \n\nFor the POST and PATCH requests, replace the AWS_REGION and AWS_ACCOUNT_ID placeholders with valid values.\n\nFor more information, see [Event Relay](https://desktop.postman.com/?desktopVersion=10.14.2&userId=1220894&teamId=0) in _Salesforce Help_."
  - name: Event Platform > Event Relay Configuration > Event Relay Config
    description: "This folder contains requests for creating and manipulating event relays.\n\nFor more information, see [Event Relay](https://desktop.postman.com/?desktopVersion=10.14.2&userId=1220894&teamId=0) in _Salesforce Help_."
  - name: Event Platform > Event Relay Configuration > Event Relay Feedback
    description: >-
      This folder contains requests for querying the status of event relays using EventRelayFeedback.


      For more information, see [Event Relay](https://desktop.postman.com/?desktopVersion=10.14.2&userId=1220894&teamId=0) in _Salesforce Help_.
  - name: Event Platform > Event Schema
    description: >-
      This folder contains API requests for getting the event schema for platform events and change data capture events.


      For more information, see these resources in the REST API Developer Guide.


      - [Platform Event Schema by Schema ID](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_event_eventschema.htm)

      - [Platform Event Schema by Event Name](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_sobject_eventschema.htm)
  - name: Event Platform > Managed Event Subscriptions
    description: "This folder contains requests for working with Managed Event Subscriptions (beta).  \nTo learn more, see [Managed Event Subscriptions (Beta)](https://developer.salesforce.com/docs/platform/pub-sub-api/guide/managed-sub.html) in the Pub/Sub API Developer Guide."
  - name: Industries
    description: "This folder regroups API request for products under the **Industries** umbrella.\n\n⚠️ Industries products require specific licenses.\n\n\U0001F4DA [Industries documentation](https://help.salesforce.com/s/articleView?id=release-notes.rn_industries.htm&release=244&type=5)."
  - name: Industries > CPQ
    description: "Start working with Salesforce CPQ APIs.\n\n\U0001F4DA [Salesforce CPQ Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.cpq_dev_api.meta/cpq_dev_api/cpq_developer_guide_intro.htm)"
  - name: Industries > CPQ > Configuration API
  - name: Industries > CPQ > Contract API
  - name: Industries > CPQ > Quote API
  - name: Industries > Loyalty Management
    description: "These API Section (Resources) come from Standard Loyalty Management Developer Guide.\n\n\U0001F4DA [Standard Loyalty Management Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/loyalty_management_apis_resources.htm)."
  - name: Industries > Loyalty Management > Basic Resources
  - name: Industries > Loyalty Management > Loyalty Program Process
    description: >-
      Run a loyalty process created from a loyalty program process template.


      Out-of-the-box loyalty program process templates come with a default set of process parameters. You can configure new parameters or remove the default ones by simply cloning a template and running the configured parameters as a customized loyalty process using the [loyalty program process API](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_process_name.htm). For example, when using the CreditPointsToMembers process template to credit points to a loyalty member, you can configure the currency value so that the credited points can be redeemed in the currency you’ve specified.


      The request and response parameters for the loyalty program process API vary depending on the input and output parameters configured for a loyalty program process in a Salesforce org
  - name: Industries > Loyalty Management > Gamification
    description: >-
      Who doesn’t like to play a game? Engage your customers more by gamifying customer activities, such as placing an order, or events, such as birthdays and anniversaries.


      Assign eligible games to a customer, let the customer play the game, and then win a reward on an external system using the [gamification REST APIs](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/loyalty_gamification_apis_reference.htm).
  - name: Industries > Loyalty Management > Promotion
    description: >-
      The [promotion APIs](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/loyalty_promotion_apis_reference.htm) allow you to set eligibility rules and limits for a promotion, choose a promotion template, and create a promotion. You can also get the details of a specific promotion, and view a list of eligible promotions for a customer’s cart.
  - name: Industries > OmniStudio
    description: >-
      You can invoke [Integration Procedures](https://help.salesforce.com/s/articleView?id=sf.os_integration_procedure_invocation_55721.htm&type=5) from other OmniStudio tools such as OmniScripts and Cards. You can also invoke Integration Procedures from Apex classes, batch jobs, REST APIs, or Salesforce flows.
  - name: GraphQL
    description: "Aggregate records, request explicit fields, version at field-level, and more with the GraphQL API for Salesforce.\n\nGraphQL is an open-source data query and manipulation platform for APIs.\n\n**Integration Made Easy**\n\nA well-defined type system that makes it easy for clients to integrate any resource from the server into their request and caching logic.\n\n**Secure Information at Scale**\n\nA schema that reflects the user's Field Level Security, so they only see the types and fields permitted at their level.\n\n\U0001F4DA [Salesforce GraphQL API documentation](https://developer.salesforce.com/docs/platform/graphql/guide/graphql-about.html)"
  - name: GraphQL > UI
  - name: GraphQL > Introspection
