  - name: Subscription Management
    description: "Use [Subscription Management API](https://developer.salesforce.com/docs/revenue/subscription-management/overview?_ga=2.87750811.2015639846.1688494637-2111347203.1688046721) to build a product-to-cash solution for your recurring business.\n\nYou can use this collection on its own or authenticate to a provisioned Trailhead playground org. If you authenticate to a playground org, use the Postman runner to populate object IDs in the Subscription Management environment variables. Then, you can make successful requests against your org.\n\n### Sign Up for a Trailhead Playground Org\n\nSign up for your org [here](https://trailhead.salesforce.com/promo/orgs/poc-revenue-cloud). When you receive the verification email, follow the instructions to verify your org.\n\n### Authenticate to Your Trailhead Playground Org\n\nUse the Salesforce Platform APIs authentication mechanism to authenticate to your Trailhead Playground org.\n\n1. Ensure the only org you're logged in to is your Subscription Management Trailhead Playground org.\n2. In Postman, ensure the **Subscription Management** environment is selected.\n3. Select the Collections tab then select the **Salesforce Platform APIs** folder.\n4. Open the **Authorization** tab.\n5. Ensure the **Type** is `OAuth 2.0`\n6. Click **Get New Access** Token.\n7. A success message appears briefly, and then you're redirected to the Manage Access Tokens dialog.\n8. Copy the instance_url to use later. Be sure to copy only the URL with no extra characters.\n9. Click **Use Token**.\n10. Open the Subscription Management environment, then open the **Variables** tab.\n11. In the **_endpoint** row, CURRENT VALUE column, paste the instance_url value that you copied in a previous step.\n12. Click **Save**.\n    \n\nYour Postman collection is now authenticated to the demo Subscription Management org.\n\n## Test Your Connection\n\nLet's verify that the connection is working.\n\n1. In **Collections**, select the **Salesforce Platform APIs** collection.\n2. Select the **Subscription Management** folder to expand it.\n2. Select the **Products** folder to expand it.\n3. Select **Query Eligible** Products to open the request in the main panel.\n4. Click **Send**.\n    \n\nPostman queries the active products in the demo org. Verify the success response.\n\n**NOTE:** You may need to turn **Follow Authorization header configuration** ON to retain the authorization header when a redirect happens to a different hostname.\n\nYou've successfully authenticated with your Trailhead Playground. To make further requests against this org, populate the environment variables with object IDs using the [Postman Collection Runner](postmanRunner.md).\n\n### Query Your Org IDs with the Postman Collection Runner\n\nUse the Postman Collection Runner to populate the environment variables with the IDs of important objects from your Trailhead Playground org.\n\n1. Ensure your environment is set to **Subscription Management.**\n2. Hover over the **Query Org \\[Postman Runner\\]** folder, select the three dots, then select **Run collection**.\n3. Ensure all the requests are checked and **Run manually** is selected. Select **Run \\[name of your collection\\]**.\n    \n\n<img src=\"https://resources.docs.salesforce.com/rel1/doc/en-us/static/misc/postman/post-runner.png\">\n\nPostman runs the queries in the Set Variables folder and populates the environment variables with the object IDs from your Trailhead Playground org.\n\nTo verify these steps, expand the Pricing folder and make a **Calculate Price (New Sale)** request. Verify the 201 Created response."
  - name: Subscription Management > Query Org [Postman Runner]
    description: >-
      Use this Postman runner to query your Trailhead Playground org for object IDs, then populate those IDs in the Subscription Management environment variables. Then, make successful requests against a Subscription Management org.


      For detailed instructions, see the documentation for the Subscription Management folder.
  - name: Subscription Management > Products
    description: >-
      To view products that can be used with Subscription Management API, query your org for products with a related Product Selling Model. For more information, see [Products](https://developer.salesforce.com/docs/revenue/subscription-management/references/products?meta=Summary) in Salesforce Developers.
  - name: Subscription Management > Pricing
    description: >-
      Use Subscription Management pricing to calculate the price of items in a subscription order, prorating the cost per period over the length of the subscription. System-level price adjustments, such as volume-based or term-based discounts, are calculated automatically. For more information see [Calculate Price](https://developer.salesforce.com/docs/revenue/subscription-management/references/prices?meta=Calculate+price) in Salesforce Developers.
  - name: Subscription Management > Quotes
  - name: Subscription Management > Orders
    description: "A Subscription management Order must be related to an OrderAction and an AppUsageAssignment.\n\n- **OrderAction** - specifies whether the order is a new sale, a renewal, a cancellation, an amendment, or another type of order.\n- **AppUsageAssignment** - specifies that this order has the app usage type `SubscriptionManagement`.\n    \n\n**Use Price Book Entry, Not Product**\n\nNotice that you don't pass in the ID of the product that is ordered, because a product can have multiple Selling Model Options. For example, a product can be sold one time, on a monthly termed subscription, and as an evergreen subscription. Instead of passing in the product ID, you pass in the Price Book Entry that is related to the Product Selling Model Option.\n\nTo learn more about creating orders, see [Create an order](https://developer.salesforce.com/docs/revenue/subscription-management/references/orders?meta=Create+an+order) in Salesforce Developers."
  - name: Subscription Management > Lifecycle Management
    description: >-
      **NOTE:** You must manually populate the IDs of your order and assets. This colleciton won't collect or store order and asset IDs.


      An asset represents a product or service that a customer has purchased. Lifecycle-managed assets show information from the initial sale of a subscription through its end date, including any cancellations, quantity changes, or renewals. Use lifecycle-managed assets for an up-to-date view of your customer's purchases and your monthly recurring revenue.


      For more information, see [Assets](https://developer.salesforce.com/docs/revenue/subscription-management/references/assets?meta=Summary) in Salesforce Developers.
  - name: Tooling
    description: "Use Tooling API to build custom development tools or apps for Lightning Platform applications. Tooling API’s SOQL capabilities for many metadata types allow you to retrieve smaller pieces of metadata. Smaller retrieves improve performance, which makes Tooling API a better fit for developing interactive applications. Tooling API provides SOAP and REST interfaces.\n\n\U0001F4DA [Tooling API Documentation](https://developer.salesforce.com/docs/atlas.en-us.api_tooling.meta/api_tooling/intro_api_tooling.htm)"
  - name: Tooling > Sandbox
    description: Manage sandboxes
  - name: UI
    description: "Build Salesforce UI for native mobile apps and custom web apps using the same API that Salesforce uses to build Lightning Experience and Salesforce for Android, iOS, and mobile web. Build user interfaces that let users work with records, list views, actions, favorites, and more. Not only do you get data and metadata in a single response, but the response matches metadata changes made to the org by Salesforce admins. You don’t have to worry about layouts, picklists, field-level security, or sharing—all you have to do is build an app that users love.\n\n\U0001F4DA [User Interface API Developer Guide](https://developer.salesforce.com/docs/atlas.en-us.uiapi.meta/uiapi/ui_api_get_started.htm)"
