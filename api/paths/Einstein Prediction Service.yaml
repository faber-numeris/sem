/services/data/v{version}/smartdatadiscovery/predict:
  post:
    tags:
      - Einstein Prediction Service
    summary: Predict
    description: Get available prediction definitions.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              predictionDefinition: <PREDICTION_DEFINITION_ID>
              type: RawData
              columnNames:
                - Quantity
                - Category
                - Sub_Category
                - Sales
                - Profit_per_Order
              rows:
                - - '2'
                  - Furniture
                  - Chairs
                  - '300'
                  - '10'
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Thu, 04 Mar 2021 13:53:39 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=31536002; includeSubDomains
          Expect-CT:
            schema:
              type: string
              example: >-
                max-age=86400, report-uri="https://a.forcesslreports.com/Expect-CT-report/00D5Y000001crJvm"
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              predictionDefinition: 1OR5Y0000010ws8
              predictions:
                - model:
                    id: 1Ot5Y0000010wzNSAQ
                  prediction:
                    middleValues: []
                    total: 88.52494255547592
                  prescriptions: []
                  status: Success
              settings:
                maxMiddleValues: 0
                maxPrescriptions: 0
                prescriptionImpactPercentage: 0
