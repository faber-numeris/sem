/.well-known/auth-configuration:
  get:
    tags:
      - Auth
    summary: Authentication Configuration Endpoint
    security:
      - noauthAuth: []
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Thu, 16 Nov 2023 15:54:15 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Access-Control-Allow-Credentials:
            schema:
              type: boolean
              example: 'false'
          Access-Control-Allow-Methods:
            schema:
              type: string
              example: GET, POST, OPTIONS
          Access-Control-Allow-Origin:
            schema:
              type: string
              example: '*'
          Vary:
            schema:
              type: string
