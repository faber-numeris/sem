                UseAndroidNativeBrowserForAuthentication: false
                shareBrowserSessionIOS: false
                shareBrowserSessionAndroid: false
              LoginPage: null
              SamlProviders: []
              AuthProviders: []
              CertificateLogin: null
              LoginPageType: standard
              LoginPageTypeConfigs: {}
/services/oauth2/introspect:
  post:
    tags:
      - Auth
    summary: OpenID Connect Token Introspection Endpoint
    security:
      - basicAuth: []
      - noauthAuth: []
    parameters:
      - name: token
        in: query
        schema:
          type: string
      - name: token_type_hint
        in: query
        schema:
          type: string
      - name: client_id
        in: query
        schema:
          type: string
      - name: client_secret
        in: query
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/IntrospectRequest'
    responses:
      '200':
        description: Introspection result.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectResponse'
/services/oauth2/register:
  post:
    tags:
      - Auth
    summary: OpenID Connect Dynamic Client Registration Endpoint
    requestBody:
      content:
        '*/*':
          schema:
            type: string
            example: >-
              "{\n    \"redirect_uris\": [\n        \"http://localhost\"\n    ],\n    \"response_types\": [\n        \"code\",\n        \"token\",\n        \"id_token\"\n    ],\n    \"grant_types\": [\n        \"authorization_code\",\n        \"implicit\",\n        \"refresh_token\"\n    ],\n    \"application_type\": \"web\",\n    \"contacts\": [\n        \"abc@sf.com\",\n        \"ve7jtb@example.org\"\n    ],\n    \"client_name\": \"Example Olivier\"\n}"
    security:
      - noauthAuth: []
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{init_access_token}}
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Thu, 16 Nov 2023 16:04:08 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Expires:
            schema:
              type: string
              example: Thu, 01 Jan 1970 00:00:00 GMT
          Content-Type:
            schema:
              type: string
              example: text/plain
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          text/plain:
            schema:
              type: string
            example: |-
              {
                  "client_id": "<client_id>",
                  "client_secret": "<client_secret>",
                  "registration_access_token": "<token>",
                  "registration_client_uri": "https://login.salesforce.com/services/oauth2/register/<client_id>",
                  "client_id_issued_at": <timestamp>,
                  "client_secret_expires_at": 0,
                  "token_endpoint_auth_method": "client_secret_post",
                  "redirect_uris": [
                      "http://localhost"
                  ],
                  "response_types": [
                      "code",
                      "token",
                      "id_token"
                  ],
                  "grant_types": [
                      "authorization_code",
                      "hybrid_auth_code",
                      "implicit",
                      "refresh_token"
                  ],
                  "contacts": [
                      "abc@sf.com"
                  ],
                  "client_name": "Sample Customer",
                  "scopes": [
                      "openid",
                      "refresh_token",
                      "id",
                      "api"
                  ]
              }
/id/keys:
  get:
    tags:
      - Auth
    summary: Salesforce Keys
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Thu, 16 Nov 2023 15:55:30 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Access-Control-Allow-Credentials:
            schema:
              type: boolean
              example: 'false'
          Access-Control-Allow-Origin:
            schema:
              type: string
              example: '*'
          Expires:
            schema:
              type: string
              example: Thu, 01 Jan 1970 00:00:00 GMT
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              keys:
