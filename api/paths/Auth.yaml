/services/oauth2/token:
  post:
    tags:
      - Auth
    summary: Refresh Token
    security:
      - basicAuth: []
      - noauthAuth: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TokenRequest'
        application/json:
          schema:
            $ref: '#/components/schemas/TokenRequest'
    responses:
      '200':
        description: Access token issued.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenResponse'
      '400':
        description: The token request was rejected.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthError'
/services/oauth2/revoke:
  post:
    tags:
      - Auth
    summary: Revoke Token
    security:
      - basicAuth: []
      - noauthAuth: []
    parameters:
      - name: token
        in: query
        description: >-
          Token to revoke. It may also be supplied in the form body; when both are
          present the query value wins.
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/RevokeTokenRequest'
    responses:
      '200':
        description: Token revoked, or the token was already invalid.
      '400':
        description: Token missing or invalid.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthError'
/.well-known/openid-configuration:
  get:
    tags:
      - Auth
    summary: OpenID Connect Discovery Endpoint
    security:
      - noauthAuth: []
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Thu, 16 Nov 2023 15:53:35 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Access-Control-Allow-Credentials:
            schema:
              type: boolean
              example: 'false'
          Access-Control-Allow-Origin:
            schema:
              type: string
              example: '*'
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              end_session_endpoint: https://<my_domain>/services/auth/idp/oidc/logout
              frontchannel_logout_supported: true
              frontchannel_logout_session_supported: false
              issuer: https://<my_domain>
              authorization_endpoint: https://<my_domain>/services/oauth2/authorize
              token_endpoint: https://<my_domain>/services/oauth2/token
              revocation_endpoint: https://<my_domain>/services/oauth2/revoke
              userinfo_endpoint: https://<my_domain>/services/oauth2/userinfo
              jwks_uri: https://<my_domain>/id/keys
              registration_endpoint: https://<my_domain>/services/oauth2/register
              introspection_endpoint: https://<my_domain>/services/oauth2/introspect
              scopes_supported:
                - cdp_ingest_api
                - custom_permissions
                - cdp_segment_api
                - content
                - cdp_api
                - chatbot_api
                - cdp_identityresolution_api
                - interaction_api
                - wave_api
                - web
                - cdp_calculated_insight_api
                - einstein_gpt_api
                - offline_access
                - id
                - api
                - eclair_api
                - email
                - pardot_api
                - lightning
                - visualforce
                - cdp_query_api
                - sfap_api
                - address
                - openid
                - profile
                - cdp_profile_api
                - refresh_token
                - phone
                - user_registration_api
                - pwdless_login_api
                - chatter_api
                - full
                - forgot_password
              response_types_supported:
                - code
                - token
                - token id_token
              subject_types_supported:
                - public
              id_token_signing_alg_values_supported:
                - RS256
              display_values_supported:
                - page
                - popup
                - touch
              token_endpoint_auth_methods_supported:
                - client_secret_post
                - client_secret_basic
                - private_key_jwt
              claims_supported:
