            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Location:
            schema:
              type: string
              example: >-
                /services/async/58.0/job/7502o00000kjNCsAAM/spec/0Aj2o000000PbakCAC
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          text/plain:
            schema:
              type: string
            example: null
