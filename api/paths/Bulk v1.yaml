        in: header
        schema:
          type: string
        example: gzip
      - name: Content-Encoding
        in: header
        schema:
          type: string
        example: gzip
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: _jobId
        in: path
        schema:
          type: string
        required: true
