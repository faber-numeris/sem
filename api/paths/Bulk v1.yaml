/services/async/{version}/job:
  post:
    tags:
      - Bulk v1
    summary: Bulk Create Job
    requestBody:
      content:
        '*/*':
          schema:
            type: string
            example: >-
              "{\n    \"operation\": \"insert\",\n    \"object\": \"Account\",\n    \"contentType\": \"CSV\"\n}"
    parameters:
      - name: X-SFDC-Session
        in: header
        schema:
          type: string
        example: '{{_accessToken}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: charset
        in: header
        schema:
          type: string
        example: UTF-8
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Thu, 16 Nov 2023 16:07:11 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Location:
            schema:
              type: string
              example: /services/async/58.0/job/7502o00000kjNCsAAM
          Content-Type:
            schema:
              type: string
              example: application/json
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              apexProcessingTime: 0
              apiActiveProcessingTime: 0
              apiVersion: 58
              assignmentRuleId: null
              concurrencyMode: Parallel
              contentType: CSV
              createdById: 005...
              createdDate: <date_time>
              externalIdFieldName: null
              fastPathEnabled: false
              id: 750...
              numberBatchesCompleted: 0
              numberBatchesFailed: 0
              numberBatchesInProgress: 0
              numberBatchesQueued: 0
              numberBatchesTotal: 0
              numberRecordsFailed: 0
              numberRecordsProcessed: 0
              numberRetries: 0
              object: <Object>
              operation: insert
              state: Open
              systemModstamp: <date_time>
              totalProcessingTime: 0
