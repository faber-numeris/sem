/services/data/v{version}/tooling/query:
  get:
    tags:
      - Tooling
    summary: Tooling Query
    description: >-
      Executes a query against an object and returns data that matches the specified criteria. Tooling API exposes objects like EntityDefinition and FieldDefinition that use the external object framework. That is, they don’t exist in the database but are constructed dynamically. Special query rules apply to virtual entities.

      If the query result is too large, it’s broken up into batches. The response contains the first batch of results and a query identifier. The identifier can be used in a request to retrieve the next batch.
    parameters:
      - name: q
        in: query
        schema:
          type: string
        description: SOQL Query
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Mon, 11 Dec 2023 09:36:10 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Sforce-Limit-Info:
            schema:
              type: string
              example: api-usage=93/15000
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              size: 38
              totalSize: 38
              done: true
              queryLocator: null
              entityTypeName: ApexClass
              records:
