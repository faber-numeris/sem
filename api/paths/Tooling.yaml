/services/data/v{version}/tooling/completions:
  get:
    tags:
      - Tooling
    summary: Tooling Completion
    description: >-
      Retrieves available code completions of the referenced type for Apex system method symbols (type=apex). Available from API version 28.0 or later.
    parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: type
        in: query
        schema:
          type: string
        description: apex or visualforce
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
/services/data/v{version}/tooling/executeAnonymous:
  get:
    tags:
      - Tooling
    summary: Tooling ExecuteAnonymous
    description: >-
      Executes Apex code anonymously. Available from API version 29.0 or later.
    parameters:
      - name: anonymousBody
        in: query
        schema:
          type: string
        example: System.Debug('awesome');
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
