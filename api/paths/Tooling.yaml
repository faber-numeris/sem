        application/json:
          schema:
            type: object
            example: |
              [
                  {
                      "className": "YourClassName",
                      "testMethods": [
                          "testMethod1",
                          "testMethod2",
                          "testMethod3"
                      ]
                  },
                  {
                      "maxFailedTests": "2"
