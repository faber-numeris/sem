    summary: Download file
    description: >-
      Lists the available objects and their metadata for your organization’s data. In addition, it provides the organization encoding, as well as the maximum batch size permitted in queries.


      You can use the If-Modified-Since header with this resource, with the date format EEE, dd MMM yyyy HH:mm:ss z. When using this header, if no available object’s metadata has changed since the provided date, a 304 Not Modified status code is returned with no response body.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
/services/data/v{version}/sobjects/{SOBJECT_API_NAME}:
  get:
    tags:
      - REST > SObject
    summary: SObject Basic Information
    description: >-
      Describes the individual metadata for the specified object. Can also be used to create a new record for a given object. For example, this can be used to retrieve the metadata for the Account object using the GET method, or create a new Account object using the POST method.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: SOBJECT_API_NAME
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
  post:
    tags:
      - REST > SObject
    summary: SObject Create
    requestBody:
      content:
        '*/*':
          schema:
            type: string
            example: '"{\n    \"Name\": \"Some value\"\n}"'
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        description: >-
          Only used for Postman Notebooks. Auth is defined at collection-level and inherited down.
        example: '{{_accessToken}}'
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: SOBJECT_API_NAME
        in: path
        schema:
          type: string
        required: true
        description: SObject API name
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Mon, 21 Jul 2025 14:34:26 GMT
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Sforce-Limit-Info:
            schema:
              type: string
              example: api-usage=2/15000
          Location:
            schema:
              type: string
              example: /services/data/v64.0/sobjects/Contact/003J800000DeOXjIAN
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              id: 003J800000DeOXjIAN
              success: true
              errors: []
