/services/data/v{version}/sobjects/{SOBJECT_API_NAME}/listviews:
  get:
    tags:
      - REST > List Views
    summary: List Views
    description: >-
      Returns the list of list views for the specified sObject, including the ID and other basic information about each list view. You can also get basic information for a specific list view by ID.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: SOBJECT_API_NAME
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
/services/data/v{version}/sobjects/{SOBJECT_API_NAME}/listviews/{QUERY_LOCATOR}/describe:
  get:
    tags:
      - REST > List Views
    summary: List View Describe
    description: >-
      Returns detailed information about a list view, including the ID, the columns, and the SOQL query.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: SOBJECT_API_NAME
        in: path
        schema:
          type: string
        required: true
      - name: QUERY_LOCATOR
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
