/services/data/v{version}/support/embeddedservice/configuration/{EMBEDDED_SERVICE_CONFIG_DEVELOPERNAME}:
  get:
    tags:
      - REST > Support and Knowledge
    summary: Embedded Service Configuration Describe
    description: >-
      Retrieves the values for your Embedded Service deployment configuration, including the branding colors, font, and site URL.


      You must be logged in to the account that owns the EmbeddedServiceConfigDeveloperName you are querying.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: EMBEDDED_SERVICE_CONFIG_DEVELOPERNAME
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
/services/data/v{version}/support/dataCategoryGroups:
  get:
    tags:
      - REST > Support and Knowledge
    summary: Data Category Groups
    description: >-
      Returns the list of list views for the specified sObject, including the ID and other basic information about each list view. You can also get basic information for a specific list view by ID.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: sObjectName
        in: query
        schema:
          type: string
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
