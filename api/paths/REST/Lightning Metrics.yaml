/services/data/v{version}/sobjects/LightningToggleMetrics:
  get:
    tags:
      - REST > Lightning Metrics
    summary: Lightning Toggle Metrics
    description: >-
      Return details about users who switched between Salesforce Classic and Lightning Experience.


      https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_lightning_togglemetrics.htm
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
