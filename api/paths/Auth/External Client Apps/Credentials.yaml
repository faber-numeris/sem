/services/data/v{version}/apps/oauth/credentials/{_appId}:
  get:
    tags:
      - Auth > External Client Apps > Credentials
    summary: Collections
    description: >-
      Returns credentials for all consumers associated with an external client app. See [OAuth Credentials by App ID](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_credentials_by_app_id.htm).
    parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        description: Replace <token> with your access token
        example: Bearer <token>
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: _appId
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
/services/data/v{version}/apps/oauth/credentials/{_appId}/{_consumerId}:
  get:
    tags:
      - Auth > External Client Apps > Credentials
    summary: Resources
    description: >-
      Returns credentials for a specific consumer. Use parameters to determine whether the request should return the key, the secret, or both key and secret. See [OAuth Credentials by Consumer ID](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_credentials_by_app_and_consumer_id.htm).
    parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        description: Replace <token> with your access token
        example: Bearer <token>
      - name: part
        in: query
        schema:
          type: string
        description: Key, Secret, or KeyAndSecret
        example: Key
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: _appId
        in: path
        schema:
          type: string
        required: true
      - name: _consumerId
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
