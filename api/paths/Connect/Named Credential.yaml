/services/data/v{version}/named-credentials/credential:
  get:
    tags:
      - Connect > Named Credential
    summary: Get Credential
    description: Get a credential.
    parameters:
      - name: externalCredential
        in: query
        schema:
          type: string
        description: Fully qualified developer name of the external credential.
      - name: principalName
        in: query
        schema:
          type: string
        description: Name of the external credential named principal.
      - name: principalType
        in: query
        schema:
          type: string
        description: |-
          Type of credential principal. Values are:
          * AwsStsPrincipal
          * NamedPrincipal
          * PerUserPrincipal
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Wed, 22 Nov 2023 12:01:04 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              authenticationProtocol: Custom
              authenticationProtocolVariant: NoAuthentication
              authenticationStatus: Configured
              credentials: {}
              externalCredential: Test
              principalName: Test
              principalType: NamedPrincipal
  post:
    tags:
      - Connect > Named Credential
    summary: Create Credential
    description: Create a credential.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              authenticationProtocol: Custom
              credentials: {}
              externalCredential: SampleExternalCredential
              principalName: SamplePrincipal
              principalType: NamedPrincipal
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Wed, 22 Nov 2023 12:06:08 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              authenticationProtocol: Custom
              authenticationStatus: Unknown
              credentials: {}
              externalCredential: SampleExternalCredential
              principalName: SamplePrincipal
              principalType: NamedPrincipal
  put:
    tags:
      - Connect > Named Credential
    summary: Update Credential
    description: Update a credential.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              externalCredential: test
              authenticationProtocol: Custom
              principalName: test
              principalType: NamedPrincipal
              credentials:
                testCredential:
                  value: '000000'
                  encrypted: true
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
  delete:
    tags:
      - Connect > Named Credential
    summary: Delete Credential
    description: Delete a credential.
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
