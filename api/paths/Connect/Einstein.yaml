/services/data/v{version}/einstein/prompt-templates/{PROMPT_TEMPLATE_API_NAME}/generations:
  post:
    tags:
      - Connect > Einstein
    summary: Generate Response Based on Prompt Template
    description: >-
      Generates a response based on the specified prompt template and input parameters ([documentation](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_prompt_template.htm)).
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example: |-
              {
                "isPreview": "false",
                "inputParams": {
                  "valueMap": {
                    <INPUT_PARAMS>
                  }
                },
                "additionalConfig": {
                    "numGenerations": 1,
                    "temperature": 0,
                    "frequencyPenalty": 0.0,
                    "presencePenalty": 0.0,
                    "additionalParameters": {},
                    "applicationName": "PromptBuilderPreview"
                }
              }
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: PROMPT_TEMPLATE_API_NAME
        in: path
        schema:
          type: string
        required: true
        description: API name of the prompt template to invoke
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Wed, 27 Mar 2024 10:30:55 GMT
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
          Connection:
            schema:
              type: string
              example: keep-alive
          Set-Cookie:
            schema:
              type: string
