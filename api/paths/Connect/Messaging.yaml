/services/data/v{version}/connect/conversation/{conversationIdentifier}/entries:
  get:
    tags:
      - Connect > Messaging
    summary: Get conversation entries
    description: >-
      Gets in-app messaging conversation entries.

      https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_conversation_entries.htm
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: conversationIdentifier
        in: path
        schema:
          type: string
        required: true
        description: Conversation identifier UUID
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Fri, 10 Jan 2025 11:40:26 GMT
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
          Connection:
            schema:
              type: string
              example: keep-alive
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Sforce-Limit-Info:
            schema:
              type: string
              example: api-usage=246/15000
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          X-Robots-Tag:
            schema:
              type: string
              example: none
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          Server:
            schema:
              type: string
              example: sfdcedge
          X-SFDC-Request-Id:
            schema:
              type: string
              example: 5a8f2802ad688ae208710a5df1950663
          X-Request-Id:
            schema:
              type: string
              example: 5a8f2802ad688ae208710a5df1950663
          X-SFDC-Edge-Cache:
            schema:
              type: string
              example: MISS
        content:
          application/json:
            schema:
              type: object
