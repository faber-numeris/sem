  post:
    tags:
      - Connect > Chatter > Groups
    summary: List of Groups - POST
    description: >-
      A list of all the groups in the organization. Get information about groups or create a group.


      https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_groups_ListOfGroups.htm
    requestBody:
      content: {}
    parameters:
      - name: name
        in: query
        schema:
          type: string
        example: New Chatter Group  (Private Access)
      - name: visibility
        in: query
        schema:
          type: string
        description: >-
          PrivateAccess—Only members of the group can see posts to this group.

          PublicAccess—All users within the community can see posts to this group.

          Unlisted—Reserved for future use.
        example: PrivateAccess
      - name: description
        in: query
        schema:
          type: string
        example: Created via API
      - name: information
        in: query
        schema:
          type: string
        description: >-
          If the group is private, the “Information” section is visible only to members.
        example: Private Information
      - name: isArchived
        in: query
        schema:
          type: boolean
        example: 'false'
      - name: isAutoArchiveDisabled
        in: query
        schema:
          type: boolean
        description: >-
          true if automatic archiving is turned off for the group, false otherwise. Defaults to false. If true, if there are no posts or comments for 90 days the group is archived.
        example: 'false'
      - name: isBroadcast
        in: query
        schema:
          type: boolean
        description: >-
          true if only group owners and managers can create posts in the group, false otherwise.
        example: 'false'
      - name: canHaveChatterGuests
        in: query
        schema:
          type: boolean
        description: >-
          true if this group allows Chatter customers, false otherwise. After this property is set to true, it cannot be set to false.
        example: 'true'
      - name: version
        in: path
        schema:
          type: string
        required: true
