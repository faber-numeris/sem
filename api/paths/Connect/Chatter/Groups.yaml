/services/data/v{version}/chatter/groups/group/{GROUP_ID}/invite:
  post:
    tags:
      - Connect > Chatter > Groups
    summary: Group Invites
    description: >-
      Invite internal and external users to join a group.


      https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_groups_invites.htm#connect_resources_groups_invites
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              invitees:
                emails:
                  - testemail1@sfdcpostman.com
                  - testemail2@sfdcpostman.com
              message: >-
                Join this group to participate in the discussion about your favorite feature.
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: GROUP_ID
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Wed, 22 Nov 2023 11:49:28 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: text/plain
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          text/plain:
            schema:
              type: string
            example: |-
              {
                  "invitations": [
                      {
                          "email": "testemail1@sfdcpostman.com",
                          "status": "Invited",
                          "userId": ""
                      },
                      ...
                  ]
              }
