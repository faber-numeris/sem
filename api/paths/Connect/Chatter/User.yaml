/services/data/v{version}/chatter/users/{USER_ID}/following:
  get:
    tags:
      - Connect > Chatter > User
    summary: Following
    description: >-
      Returns a list of people, groups, records, topics, and files that the specified user is following. Also used to follow records.


      https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_users_FollowingUsers.htm?search_text=following
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: USER_ID
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Mon, 20 Nov 2023 16:25:01 GMT
          Strict-Transport-Security:
