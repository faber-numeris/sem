/services/data/v{version}/connect/business-rules/expression-set/version/{expressionSetVersionId}/dependencies:
  get:
    tags:
      - >-
        Connect > Industries > Business Rules Engine > expression-set > version
    summary: Retrieve expression set version dependencies
    description: >-
      [https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_resources_expression_set_dependencies.htm](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_resources_expression_set_dependencies.htm)


      # Expression Set Version Dependencies (GET)


      Retrieve expression set version dependencies.Resource


      ```

      /connect/business-rules/expression-set/version/${expressionSetVersionId}/dependencies


       ```

      Resource Example


      ```

      https://yourInstance.salesforce.com/services/data/v58.0/connect/business-rules/expression-set/version/9QARN000000016v4AA/dependencies


       ```

      Available version


      58.0


      Requires Chatter


      No


      HTTP methods


      GET


      Response body for GET


      [Expression Set Version Dependency](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_expression_set_version_dependency_output.htm)
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: expressionSetVersionId
        in: path
        schema:
          type: string
        required: true
        description: 'Expression Set Version Id: For Example 9QLHo000000LBjEOAW'
        example: 9QMHo000000LBnbOAG
