/services/data/v{version}/connect/business-rules/decision-matrices/{matrixUniqueName}:
  post:
    tags:
      - Connect > Industries > Business Rules Engine > decision-matrices
    summary: Lookup Table
    description: >-
      # Decision Matrix (Lookup Table)


      Performs a lookup on decision matrix rows based on the input values provided, and returns the row’s output.Resource


      ```

      /connect/business-rules/decision-matrices/${matrixName}


       ```

      Resource Example


      ```

      https://yourInstance.salesforce.com/services/data/vXX.X/connect

      /business-rules/decision-matrices/InsurancePremium


       ```

      Available version


      55.0


      Requires Chatter


      No


      HTTP methods


      POST


      Request body for POST


      JSON example


      ```

      {

        "inputs": [
          {
            "input": [
              {
                "name": "premium",
                "value": "2400"
              }
            ]
          }
        ],
        "options": {
          "effectiveDate": "2022-12-03T10:15:30Z"
        }
      }


       ```

      Here, premium is a column header in the matrix, and 2400 is a value of a cell in the column.Properties


      | Name | Type | Description | Required or Optional | Available Version |

      | --- | --- | --- | --- | --- |

      | inputs | [Decision Matrix Input](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_requests_decision_matrix_input.htm) | List of inputs passed to a decision matrix. An input may contain multiple variables. | Required | 55.0 |

      | options | [Decision Matrix Options Input](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_requests_decision_matrix_options.htm) | The lookup options for a decision matrix. | Optional | 55.0 |


      Response body for POST


      [Decision Matrix Lookup Result](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_bre_decision_matrix_lookup_result.htm)
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              inputs:
                - input:
                    - name: myColumnInput
                      value: One
              options: {}
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: matrixUniqueName
        in: path
        schema:
          type: string
        required: true
        description: >-
          The value of Unique Name is the unique identifier of the record, which is sourced from the name of a decision matrix.
        example: myDecisionMatrix
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Thu, 07 Sep 2023 12:12:26 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            examples:
              example-0:
                summary: Status201-AcceptedButWarning
                value:
                  outputs:
                    - error: >-
                        Looks like there isn’t any output for the specified input parameters in the lookup table.
                      results: []
              example-1:
                summary: Status201-Success
                value:
                  outputs:
                    - results:
                        - name: myColumnOutput
                          value: '1'
              example-2:
                summary: Status201-Success
                value:
                  outputs: []
              example-3:
                summary: Status201-KeyPairNotFound
                value:
                  outputs:
                    - error: >-
                        Looks like there isn’t any output for the specified input parameters in the lookup table.
                      results: []
      '400':
        description: Bad Request
        headers:
          Date:
            schema:
              type: string
              example: Thu, 07 Sep 2023 11:50:19 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            examples:
              example-0:
