       ```

      Available version


      55.0


      Requires Chatter


      No


      HTTP methods


      POST


      Request body for POST


      JSON example


      ```

      {

         "conditions" : {
            "conditionsList" : [
               {
                  "fieldName": "state__c",
                  "value": "MH"
               },
               {
                  "fieldName": "validity__c",
                  "value": 30
               }
            ]
         }
      }


