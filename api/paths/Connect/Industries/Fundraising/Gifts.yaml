                        paymentinstrument:
                          href: >-
                            /services/data/vXX.X/sobjects/sObject/<SFDC_PAYMENT_INSTRUMENT_ID>
                          id: <SFDC_PAYMENT_INSTRUMENT_ID>
                        gifttransactiondesignation:
                          - href: >-
                              /services/data/vXX.X/sobjects/sObject/<SFDC_GIFT_TRANSACTION_DESIGNATION_ID>
                            id: <SFDC_GIFT_TRANSACTION_DESIGNATION_ID>
                    - success: true
                      links:
                        account:
                          href: >-
