                  }
/services/data/v{version}/connect/fundraising/transactions/payment-updates:
  post:
    tags:
      - Connect > Industries > Fundraising > Gifts
    summary: Update Gift Transaction Payments
    description: "Update the gateway and processor metadata for gift transactions.\n\n## Required Attributes:\n\n- giftTransactionId\n    \n- transactionStatus"
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              updates:
                - giftTransactionId: <SFDC_GIFT_TRANSACTION_ID>
                  transactionStatus: Paid
                  processorReference: string
                  gatewayReference: string
                  lastGatewayResponseCode: invalid_cvc
                  lastGatewayErrorMessage: >-
                    The card’s security code is invalid. Check the card’s security code or use a different card.
                  lastGatewayProcessedDateTime: '2023-07-06T21:57:51Z'
                  processorTransactionFee: 0.5
                  gatewayTransactionFee: 0.25
                  donorCoverAmount: 10.5
                - giftTransactionId: <SFDC_GIFT_TRANSACTION_ID>
                  transactionStatus: Paid
                  processorReference: string
                  gatewayReference: string
                  lastGatewayResponseCode: invalid_cvc
                  lastGatewayErrorMessage: >-
                    The card’s security code is invalid. Check the card’s security code or use a different card.
                  lastGatewayProcessedDateTime: '2023-07-06T21:57:51Z'
                  processorTransactionFee: 1
                  gatewayTransactionFee: 0.45
                  donorCoverAmount: 20
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Content-Type:
            schema:
              type: string
              example: application/json
        content:
          application/json:
            schema:
              type: object
            examples:
              example-0:
                summary: Status201-UpdateTransactionPaymentSuccess
                value:
                  successes: 2
                  failures: 0
                  notProcessed: 0
                  details:
                    - success: true
                      links:
                        gifttransaction:
                          href: >-
                            /services/data/vXX.X/sobjects/sObject/<SFDC_GIFT_TRANSACTION_ID>
                          id: <SFDC_GIFT_TRANSACTION_ID>
                    - success: true
                      links:
                        gifttransaction:
                          href: >-
                            /services/data/vXX.X/sobjects/sObject/<SFDC_GIFT_TRANSACTION_ID>
                          id: <SFDC_GIFT_TRANSACTION_ID>
              example-1:
                summary: Status201-UpdateTransactionPaymentRequestValidationFailed
                value:
                  successes: 1
                  failures: 1
                  notProcessed: 0
                  details:
                    - success: false
                      errors:
                        field: id
                        message: <invalid id message>
                    - success: true
                      links:
                        gifttransaction:
                          href: >-
                            /services/data/vXX.X/sobjects/sObject/<SFDC_GIFT_TRANSACTION_ID>
                          id: <SFDC_GIFT_TRANSACTION_ID>
          text/plain:
            schema:
              type: string
            example: >-
              // This is a scenario where there is a validation rule on the Gift Transaction object requiring the donor cover amount to be less than 10.00. One database error occurs for the 10.50 cover amount, causing the other two to be rolled back with success of false and no record links.

              {

                  "successes": 0,
                  "failures": 1,
                  "notProcessed": 1,
                  "details": [
                      {
                          "success": false,
                          "errors": {
                              "message": "Donor cover amount must be less than 10.00"
                          }
                      },
                      {
                          "success": false
                      }
                  ]
              }
      '400':
