/services/data/v{version}/tooling/sobjects/SandboxInfo:
  post:
    tags:
      - Tooling > Sandbox
    summary: Create/Clone Sandbox
    description: >-
      Creates or clones a sandbox. If you wish to clone, fill the SourceId body field with the org Id of the source sandbox.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              SandboxName: devSandbox
              LicenseType: DEVELOPER
              TemplateId: null
              HistoryDays: 0
              CopyChatter: false
              AutoActivate: false
              ApexClassId: null
              Description: My new fresh sandbox
              SourceId: null
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Mon, 11 Dec 2023 10:44:57 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Sforce-Limit-Info:
            schema:
              type: string
              example: api-usage=312/15000
          Location:
            schema:
              type: string
              example: >-
                /services/data/v59.0/tooling/sobjects/SandboxInfo/0GQ4H000000CxSzWAK
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              id: 0GQ4H000000CxSzWAK
              success: true
              errors: []
              warnings: []
              infos: []
