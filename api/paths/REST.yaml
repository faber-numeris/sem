/services/data/v{version}/theme:
  get:
    tags:
      - REST
    summary: Themes
    description: >-
      Gets the list of icons and colors used by themes in the Salesforce application. Theme information is provided for objects in your organization that use icons and colors in the Salesforce UI.


      The If-Modified-Since header can be used with this resource, with a date format of EEE, dd MMM yyyy HH:mm:ss z. When this header is used, if the object metadata has not changed since the provided date, a 304 Not Modified status code is returned, with no response body.


      https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_themes.htm
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Wed, 27 Sep 2023 15:30:15 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Sforce-Limit-Info:
            schema:
              type: string
              example: api-usage=8/15000
          ETag:
            schema:
              type: string
              example: '"81846348--gzip"'
          Last-Modified:
            schema:
              type: string
              example: Tue, 19 Sep 2023 22:01:04 GMT
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
