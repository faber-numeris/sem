/services/data/v{version}/limits/recordCount:
  get:
    tags:
      - REST
    summary: Record Count
    description: >-
      Lists information about object record counts in your organization.

      This resource is available in REST API version 40.0 and later for API users with the “View Setup and Configuration” permission. The returned record count is approximate, and does not include the following types of records:


      Deleted records in the recycle bin.

      Archived records.

      https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_record_count.htm
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: sObjects
        in: query
        schema:
          type: string
        description: >-
          A comma-delimited list of object names. If a listed object is not found in the org, it is ignored and not returned in the response.

          This parameter is optional. If this parameter is not provided, the resource returns record counts for all objects in the org.
        example: Account,Contact,Lead
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: OK
        headers:
          Date:
            schema:
              type: string
              example: Wed, 27 Sep 2023 15:28:16 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-XSS-Protection:
            schema:
              type: string
              example: 1; mode=block
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Sforce-Limit-Info:
            schema:
              type: string
              example: api-usage=3/15000
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              sObjects:
                - count: 12
                  name: Account
                - count: 20
                  name: Contact
                - count: 22
                  name: Lead
