/services/data/v{version}/ui-api/favorites:
  post:
    tags:
      - UI > Favorites
    summary: Create a Favorite
    description: Create a Favorite
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              name: Favorite Name
              sortOrder: 1
              target: API Name or ID
              targetType: ListView | ObjectHome | Record | Tab
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '201':
        description: Created
        headers:
          Date:
            schema:
              type: string
              example: Fri, 06 Oct 2023 10:03:31 GMT
          Strict-Transport-Security:
            schema:
              type: string
              example: max-age=63072000; includeSubDomains
          X-Content-Type-Options:
            schema:
              type: string
              example: nosniff
          X-Robots-Tag:
            schema:
              type: string
              example: none
          Cache-Control:
            schema:
              type: string
              example: no-cache,must-revalidate,max-age=0,no-store,private
          Content-Type:
            schema:
              type: string
              example: application/json;charset=UTF-8
          Vary:
            schema:
              type: string
              example: Accept-Encoding
          Content-Encoding:
            schema:
              type: string
              example: gzip
          Transfer-Encoding:
            schema:
              type: string
              example: chunked
        content:
          application/json:
            schema:
              type: object
            example:
              accessCount: 1
              iconColor: '5867E8'
              iconUrl: >-
                https://pozil-dev-ed.my.salesforce.com/img/icon/t4v35/standard/account_120.png
              id: 0MV4H0000004qIeWAI
              lastAccessDate: '2023-10-06T10:03:32.000Z'
