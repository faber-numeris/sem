/services/data/v{version}/ui-api/favorites/batch:
  put:
    tags:
      - UI > Favorites
    summary: Update a Batch of Favorites
    description: >-
      Update all favorites at once. The sort order is updated to the given relative ordering. Any favorites missing from the request body are deleted.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              favorites:
                - id: 0MVR00000004DhnOAE
                  name: Q4 Perf
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: OK
