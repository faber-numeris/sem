/services/data/v{version}/tooling/sobjects/NamedCredential/{NAMED_CREDENTIAL_ID}:
  get:
    tags:
      - Event Platform > Event Relay Configuration > Named Credential
    summary: Get named credential
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: NAMED_CREDENTIAL_ID
        in: path
        schema:
          type: string
        required: true
        example: 0XA4H000000TNRhWAO
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
  delete:
    tags:
      - Event Platform > Event Relay Configuration > Named Credential
    summary: Delete named credential
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: NAMED_CREDENTIAL_ID
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
  patch:
    tags:
      - Event Platform > Event Relay Configuration > Named Credential
    summary: Update named credential
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              FullName: MyNamedCredential
              Metadata:
                label: My Named Credential
                endpoint: arn:aws:AWS_REGION:AWS_ACCOUNT_ID
                principalType: Anonymous
                protocol: NoAuthentication
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: NAMED_CREDENTIAL_ID
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
/services/data/v{version}/tooling/sobjects/NamedCredential:
