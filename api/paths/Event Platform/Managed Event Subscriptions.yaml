              Metadata:
                state: STOP
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
      - name: managedEventSubscriptionId
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
  delete:
    tags:
      - Event Platform > Managed Event Subscriptions
    summary: Delete managed event subscription
    parameters:
      - name: version
        in: path
