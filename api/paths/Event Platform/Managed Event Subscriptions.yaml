/services/data/v{version}/tooling/sobjects/ManagedEventSubscription:
  post:
    tags:
      - Event Platform > Managed Event Subscriptions
    summary: Create managed event subscription
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              FullName: Managed_Sub_OpportunityChangeEvent
              Metadata:
                label: Managed Sub OpportunityChangeEvent
                topicName: /data/OpportunityChangeEvent
                defaultReplay: LATEST
                state: RUN
                errorRecoveryReplay: LATEST
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
