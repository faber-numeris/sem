/services/data/v{version}/actions/standard/createOrUpdateAssetFromOrder:
  post:
    tags:
      - Subscription Management > Lifecycle Management
    summary: CreateAssetFromOrder
    requestBody:
      content:
        '*/*':
          schema:
            type: string
            example: >-
              "{\n    \"inputs\": [\n        {\n            \"orderId\": \"{{currentOrder}}\"\n        }\n    ]\n}"
    parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json: {}
