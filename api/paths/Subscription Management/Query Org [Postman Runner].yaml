/services/oauth2/userinfo:
  get:
    tags:
      - Subscription Management > Query Org [Postman Runner]
    summary: User Info
    parameters:
      - name: Authorization
        in: header
        description: Bearer access token.
        schema:
          type: string
    responses:
      '200':
        description: Successful response
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoResponse'
      '400':
        description: The user info request could not be processed.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesforceError'
      '401':
        description: The access token is missing, invalid, or expired.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesforceError'
      '404':
        description: The requested user was not found.
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesforceError'
/services/data:
  get:
    tags:
      - Subscription Management > Query Org [Postman Runner]
    summary: Get Latest Release Version
    responses:
      '200':
        description: Successful response
        headers:
          Content-Type:
            schema:
              type: string
            example: application/json; charset=UTF-8
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/APIVersion'
/services/data/v{version}/commerce/payments/payment-methods:
  post:
    tags:
      - Subscription Management > Query Org [Postman Runner]
    summary: Create Payment Method
    requestBody:
      content:
        application/json:
          schema:
            type: object
            example:
              paymentGatewayId: '{{defaultPaymentGatewayId}}'
              cardPaymentMethod:
                cardHolderName: '{{_userFullName}}'
                expiryMonth: '11'
                expiryYear: '2222'
                cardNumber: '4111111111111111'
                cvv: '111'
                cardCategory: CreditCard
                cardType: VISA
                startYear: '2013'
                startMonth: '7'
                nickName: Default Payment Method
                accountId: '{{defaultAccountId}}'
              phone: '4155551212'
              email: '{{_userEmail}}'
              additionalData:
                key1: value1
                key2: value2
    parameters:
      - name: version
        in: path
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
