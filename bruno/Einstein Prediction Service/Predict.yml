info:
  name: Predict
  type: http
  seq: 1

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/smartdatadiscovery/predict"
  body:
    type: json
    data: |-
      {
          "predictionDefinition": "<PREDICTION_DEFINITION_ID>",
          "type": "RawData",
          "columnNames": [
              "Quantity",
              "Category",
              "Sub_Category",
              "Sales",
              "Profit_per_Order"
          ],
          "rows": [
              [
                  "2",
                  "Furniture",
                  "Chairs",
                  "300",
                  "10"
              ]
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

