info:
  name: Issue a Voucher
  type: http
  seq: 6

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/connect/loyalty/programs/:loyaltyProgramName/program-processes/:processName"
  params:
    - name: journalTypeId
      value: ""
      type: query
      disabled: true
    - name: loyaltyProgramName
      value: ""
      type: path
    - name: processName
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
         "processParameters":[
            {
               "MemberId":"0lMxx00000000BJEAY",
               "VoucherCode":"15OFF",
               "VoucherFaceValue":15,
               "VoucherExpirationDate":"2022-07-13"
            }
         ]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        //bru.setVar('loyaltyProgramName','xyz');
        bru.setVar('processName','IssueVoucher');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example with a member ID
    request:
      url: https://itab2c--devloyalty.sandbox.my.salesforce.com/services/data/v60.0/connect/loyalty/programs/Volare/program-processes/processName
      method: POST
      params:
        - name: journalTypeId
          value: ""
          type: query
          disabled: true
      body:
        type: json
        data: |-
          {
             "processParameters":[
                {
                   "MemberId":"0lMxx00000000BJEAY",
                   "VoucherCode":"15OFF",
                   "VoucherFaceValue":15,
                   "VoucherExpirationDate":"2022-07-13"
                }
             ]
          }
    response:
      body:
        type: text
        data: ""
  - name: example with a membership number
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/connect/loyalty/programs/:loyaltyProgramName/program-processes/:processName"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{accessToken}}
      params:
        - name: journalTypeId
          value: ""
          type: query
          disabled: true
        - name: loyaltyProgramName
          value: ""
          type: path
        - name: processName
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
             "processParameters":[
                {
                   "MembershipNumber":"003",
                   "VoucherCode":"15OFF",
                   "VoucherDiscountPercentage":20
                }
             ]
          }
    response:
      body:
        type: text
        data: ""

docs: |-
  [Issue a Voucher](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_issue_voucher.htm)

  NOTE:

  In the Pre-request. Script Tab, make changes in the variables value accordingly with the real Process Name to invoke.
