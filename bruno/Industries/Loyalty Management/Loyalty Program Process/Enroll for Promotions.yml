info:
  name: Enroll for Promotions
  type: http
  seq: 4

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/connect/loyalty/programs/:loyaltyProgramName/program-processes/:processName"
  params:
    - name: journalTypeId
      value: ""
      type: query
      disabled: true
    - name: loyaltyProgramName
      value: ""
      type: path
    - name: processName
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
         "processParameters":[
            {
               "MembershipNumber":"Member123",
               "PromotionId":"0c8J80000008OMhIAM"
            }
         ]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        //bru.setVar('loyaltyProgramName','xyz');
        bru.setVar('processName','EnrollInPromotion');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example with a membership number
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/connect/loyalty/programs/:loyaltyProgramName/program-processes/:processName"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{accessToken}}
      params:
        - name: journalTypeId
          value: ""
          type: query
          disabled: true
        - name: loyaltyProgramName
          value: ""
          type: path
        - name: processName
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
             "processParameters":[
                {
                   "MembershipNumber":"M1234",
                   "PromotionName":"Flat20"
                }
             ]
          }
    response:
      body:
        type: text
        data: ""

docs: |-
  [Enroll for Promotions](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_enroll_ln_promotion.htm)

  NOTE:

  In the Pre-request. Script Tab, make changes in the variables value accordingly with the real Process Name to invoke.
