info:
  name: Member Profile
  type: http
  seq: 4

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/loyalty-programs/:loyaltyProgramName/members?memberId=&membershipNumber=&programCurrencyName="
  params:
    - name: memberId
      value: ""
      type: query
      description: The ID of the loyalty program member.
    - name: membershipNumber
      value: ""
      type: query
      description: The membership number of the loyalty program member.
    - name: programCurrencyName
      value: ""
      type: query
      description: |-
        The name of the loyalty program currency associated with the member.
        Use this parameter to get the details of the member’s points-related information for a specific currency.
    - name: loyaltyProgramName
      value: ""
      type: path
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Member Profile
    request:
