info:
  name: Transaction Journals Simulation
  type: http
  seq: 9

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/connect/realtime/loyalty/programs/:loyaltyProgramName"
  params:
    - name: loyaltyProgramName
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "transactionJournals": [
          {
            "CurrencyIsoCode": "EUR",
            "ActivityDate": "2022-01-04T12:45:19Z",
            "JournalDate": "2022-01-04T00:45:19Z",
            "Brand": "",
            "Establishment": "Apple",
            "ExternalTransactionNumber": "P1-981950",
            "JournalTypeId": "0lET10000004CQp",
            "LoyaltyProgramId": "0lpT10000004CdN",
            "MemberId": "0lMT10000004CfA",
            "TransactionAmount": "117",
            "TransactionLocation": "HitechCity",
            "VoucherCode": "",
            "Origin": "asdf",
            "Distance": "5",
            "Destination": "Hyderabad",
            "FlightNumber": "SF-Ran-001",
            "Status": "Pending"
          }
        ],
        "runSetting": {
          "isSimulation": true
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        bru.setGlobalEnvVar('currentDatetime', moment().format(("YYYY-MM-DDTHH:MM:SS")));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Standard Documentation:

  [https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_loyalty_program_process_simulation.htm](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_loyalty_program_process_simulation.htm)
