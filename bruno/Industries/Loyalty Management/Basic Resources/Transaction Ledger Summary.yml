http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/loyalty/programs/:loyaltyProgramName/members/:membershipNumber/transaction-ledger-summary"
  params:
    - name: journalSubTypeName
      value: ""
      type: query
      description: Returns the transaction journals filtered by the specified journal subtype.
      disabled: true
    - name: additionalTransactionJournalAttributes
      value: ""
      type: query
      description: Returns the list of transaction journal fields.
      disabled: true
    - name: journalTypeName
      value: ""
      type: query
      description: Returns the transaction journals filtered by the specified journal type.
      disabled: true
    - name: pageNumber
      value: ""
      type: query
      description: |
        Returns the transaction journals for the specified page number.
      disabled: true
    - name: periodEndDate
      value: ""
      type: query
      description: Returns the transaction journals filtered by the specified end date.
      disabled: true
    - name: periodStartDate
      value: ""
      type: query
      description: Returns the transaction journals filtered by the specified start date.
      disabled: true
    - name: loyaltyProgramName
      value: ""
      type: path
    - name: membershipNumber
      value: ""
      type: path
  body:
    type: json
    data: ""
  auth: inherit

