info:
  name: Read Quote API
  type: http
  seq: 3

http:
  method: GET
  url: "{{_endpoint}}/services/apexrest/SBQQ/ServiceRouter?reader=SBQQ.QuoteAPI.QuoteReader&uid="
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: reader
      value: SBQQ.QuoteAPI.QuoteReader
      type: query
    - name: uid
      value: ""
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The Read Quote API reads a quote from a CPQ quote ID.
  Available in: Salesforce CPQ Summer ’16 and later

  https://developer.salesforce.com/docs/atlas.en-us.cpq_dev_api.meta/cpq_dev_api/cpq_api_read_quote.htm
