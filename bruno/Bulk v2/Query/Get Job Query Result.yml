  url: "{{_endpoint}}/services/data/v{{version}}/jobs/query/{{_jobId}}/results"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: test/csv
  params:
    - name: locator
      value: ""
      type: query
      disabled: true
    - name: maxRecords
