info:
  name: Get Job Failed Record Results
  type: http
  seq: 9

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/jobs/ingest/{{_jobId}}/failedResults"
  headers:
    - name: Content-Type
      value: application/json
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Get Job Failed Record Results
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/jobs/ingest/{{_jobId}}/failedResults"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 20 Nov 2023 15:04:29 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Sforce-Limit-Info
          value: api-usage=12/15000
        - name: Content-Type
          value: text/csv
        - name: Vary
          value: Accept-Encoding
