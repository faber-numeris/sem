http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/ui-api/favorites"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "name": "Favorite Name",
          "sortOrder": 1,
          "target": "API Name or ID",
          "targetType": "ListView | ObjectHome | Record | Tab"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

