info:
  name: Passwordless Login - Token Exchange
  type: http
  seq: 10

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/token"
  body:
    type: form-urlencoded
    data:
      - name: code
        value: <code>
        description: Auth Code from the Authorize response
      - name: grant_type
        value: authorization_code
      - name: client_id
        value: "{{clientId}}"
      - name: redirect_uri
        value: "{{redirectUrl}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: This exchanges the auth code returned in the Authorize Request for an access token and refresh token. This follows the standard Auth Code flow/Webserver Code Flow pattern. The Code is the return form the Authorization call.
