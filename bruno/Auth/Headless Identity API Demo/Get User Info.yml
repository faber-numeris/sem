info:
  name: Get User Info
  type: http
  seq: 11

http:
  method: GET
  url: "{{url}}{{site}}/services/oauth2/userinfo"
  headers:
    - name: Authorization
      value: Bearer <Token>
      description: Replace <token> with your access token
    - name: Content-Type
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: This requests uses an access token to get user information from Salesforce using the standard `/userinfo` endpoint.
