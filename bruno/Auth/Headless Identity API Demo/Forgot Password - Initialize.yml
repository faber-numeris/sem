info:
  name: Forgot Password - Initialize
  type: http
  seq: 6

http:
  method: POST
  url: "{{url}}{{site}}/services/auth/headless/forgot_password"
  body:
    type: json
    data: |-
      {
          "username": "<username>",
          "recaptcha": "<recaptcha token>"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
