info:
  name: Revoke Token
  type: http
  seq: 12

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/revoke"
  body:
    type: form-urlencoded
    data:
      - name: token
        value: "{{_accessToken}}"
        description: "Replace with a valid access token or refresh token. "

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "This calls the standard revoke endpoint, passing in your access token. This endpoint should be called as part of your logout process to invalidate the access and refresh token. "
