info:
  name: Web Server Flow 1
  type: http
  seq: 6

http:
  method: GET
  url: "{{url}}{{site}}/services/oauth2/authorize?response_type=code&client_id={{clientId}}&redirect_uri={{redirectUrl}}&scope=full refresh_token"
  params:
    - name: response_type
      value: code
      type: query
    - name: client_id
      value: "{{clientId}}"
      type: query
    - name: redirect_uri
      value: "{{redirectUrl}}"
      type: query
    - name: scope
      value: full refresh_token
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Web Server Flow 1
    request:
      url: "{{url}}{{site}}/services/oauth2/authorize?response_type=code&client_id={{clientId}}&redirect_uri={{redirectUrl}}&scope=full refresh_token"
      method: GET
      params:
        - name: response_type
          value: code
          type: query
        - name: client_id
          value: "{{clientId}}"
          type: query
        - name: redirect_uri
          value: "{{redirectUrl}}"
          type: query
        - name: scope
          value: full refresh_token
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: Content-Security-Policy
          value: upgrade-insecure-requests
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: must-revalidate,no-cache,no-store
        - name: Content-Type
          value: text/html; charset=UTF-8
        - name: Vary
          value: Accept-Encoding
        - name: Content-Encoding
          value: gzip
        - name: Connection
          value: close
      body:
        type: html
        data: |-
          <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
          <html>

          <head>
          	<meta HTTP-EQUIV="PRAGMA" CONTENT="NO-CACHE">





          	<script>
          		function redirectOnLoad() {
          if (this.SfdcApp && this.SfdcApp.projectOneNavigator) { SfdcApp.projectOneNavigator.handleRedirect('<my-domain>?ec=302&startURL=%2Fsetup%2Fsecur%2FRemoteAccessAuthorizationPage.apexp%3Fsource%3D<token>'); }  else 
          if (window.location.replace){ 
          window.location.replace('<my-domain>?ec=302&startURL=%2Fsetup%2Fsecur%2FRemoteAccessAuthorizationPage.apexp%3Fsource%3D<token>');
          } else {
          window.location.href ='<my-domain>?ec=302&startURL=%2Fsetup%2Fsecur%2FRemoteAccessAuthorizationPage.apexp%3Fsource%3D<token>';
          } 
          } 
          redirectOnLoad();
          	</script>

          </head>


          </html>





          <!-- Body events -->
          <script type="text/javascript">
          	function bodyOnLoad(){if(window.PreferenceBits){window.PreferenceBits.prototype.csrfToken="null";};}function bodyOnBeforeUnload(){}function bodyOnFocus(){}function bodyOnUnload(){}
          </script>

          </body>

          </html>


