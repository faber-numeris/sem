info:
  name: Web Server Flow 2
  type: http
  seq: 7

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/token"
  body:
    type: multipart-form
    data:
      - name: code
        type: text
        value: ""
      - name: grant_type
        type: text
        value: authorization_code
      - name: client_id
        type: text
        value: "{{clientId}}"
      - name: client_secret
        type: text
        value: "{{clientSecret}}"
      - name: redirect_uri
        type: text
        value: "{{redirectUrl}}"
      - name: format
        type: text
        value: json

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();
        const id = jsonData.id.split('/');

        const context = bru.getEnvName() ? { set: (k, v) => bru.setEnvVar(k, v), get: (k) => bru.getEnvVar(k) } : { set: (k, v) => bru.setVar(k, v), get: (k) => bru.getVar(k) };
        context.set("_accessToken", jsonData.access_token);
        context.set("_refreshToken", jsonData.refresh_token);
        context.set("_endpoint", jsonData.instance_url);
        context.set("_userId", id.pop());
        context.set("_orgId", id.pop());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Web Server Flow 2
    request:
      url: "{{url}}{{site}}/services/oauth2/token"
      method: POST
      body:
        type: multipart-form
        data:
          - name: code
            type: text
            value: aPrx4y_KzscWzywk1LwqIbwyH4R7DKoV5gLaVF87dSTTysEc8e9pu1f5azVNSsws2MruIV4I0A==
          - name: grant_type
            type: text
            value: authorization_code
          - name: client_id
            type: text
            value: "{{clientId}}"
          - name: client_secret
            type: text
            value: "{{clientSecret}}"
          - name: redirect_uri
            type: text
            value: "{{redirectUrl}}"
          - name: format
            type: text
            value: json
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 04 Oct 2023 16:25:30 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Expires
          value: Thu, 01 Jan 1970 00:00:00 GMT
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Vary
          value: Accept-Encoding
        - name: Content-Encoding
          value: gzip
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          {
              "access_token": "<access_token>",
              "refresh_token": "<refresh_token>",
              "signature": "<base64>",
              "scope": "refresh_token full",
              "id_token": "<id_token>",
              "instance_url": "<my_domain>",
              "id": "https://login.salesforce.com/id/00D.../005...",
              "token_type": "Bearer",
              "issued_at": "<timestamp>"
          }
