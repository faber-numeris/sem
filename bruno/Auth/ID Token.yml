info:
  name: ID Token
  type: http
  seq: 21

http:
  method: GET
  url: "{{_endpoint}}/id/{{_orgId}}/{{_userId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

