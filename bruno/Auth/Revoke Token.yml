info:
  name: Revoke Token
  type: http
  seq: 14

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/revoke"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: token
        value: "{{_accessToken}}"
        description: If an access token is included, Salesforce invalidates it and revokes the token. If a refresh token is included, Salesforce revokes it and any associated access tokens.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Revoke Token
    request:
      url: "{{url}}{{site}}/services/oauth2/revoke"
      method: POST
      headers:
        - name: Content-Type
          value: application/x-www-form-urlencoded
      body:
        type: form-urlencoded
        data:
          - name: token
            value: "{{_accessToken}}"
