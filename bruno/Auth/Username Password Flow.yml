info:
  name: Username Password Flow
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Accept
      value: application/json
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}{{secretToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();
        const id = jsonData.id.split('/');

        const context = bru.getEnvName() ? { set: (k, v) => bru.setEnvVar(k, v), get: (k) => bru.getEnvVar(k) } : { set: (k, v) => bru.setVar(k, v), get: (k) => bru.getVar(k) };
        context.set("_accessToken", jsonData.access_token);
        context.set("_endpoint", jsonData.instance_url);
        context.set("_userId", id.pop());
        context.set("_orgId", id.pop());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful OAuth Username Password Login
    request:
      url: https://login.salesforce.com/services/oauth2/token
      method: POST
      headers:
        - name: Content-Type
          value: application/x-www-form-urlencoded
        - name: Accept
          value: application/json
      body:
        type: form-urlencoded
        data:
          - name: grant_type
            value: password
          - name: client_id
            value: CLIENT_ID_GOES_HERE
          - name: client_secret
            value: CLIENT_SECRET_GOES_HERE
          - name: username
            value: demo@pozil.org
