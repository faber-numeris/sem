info:
  name: OpenID Connect Token Introspection Endpoint
  type: http
  seq: 18

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/introspect"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Accept
      value: application/json
  body:
    type: form-urlencoded
    data:
      - name: token
        value: "{{_accessToken}}"
      - name: token_type_hint
        value: access_token
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful OpenID Connect Token Introspection Endpoint
    request:
      url: "{{url}}{{site}}/services/oauth2/introspect"
      method: POST
      headers:
        - name: Content-Type
          value: application/x-www-form-urlencoded
        - name: Accept
          value: application/json
      body:
        type: form-urlencoded
        data:
          - name: token
            value: "{{_accessToken}}"
          - name: token_type_hint
            value: access_token
          - name: client_id
            value: "{{clientId}}"
          - name: client_secret
            value: "{{clientSecret}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Thu, 16 Nov 2023 15:54:42 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Vary
          value: Accept-Encoding
        - name: Content-Encoding
          value: gzip
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          {
              "active": true,
              "scope": "<scope_list>",
              "client_id": "<client_id>",
              "username": "<username>",
              "sub": "https://login.salesforce.com/id/00D.../005...",
              "token_type": "access_token",
              "exp": <timestamp>,
              "iat": <timestamp>,
              "nbf": <timestamp>
          }
