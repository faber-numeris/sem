info:
  name: Device Flow 2
  type: http
  seq: 11

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/token"
  body:
    type: multipart-form
    data:
      - name: grant_type
        type: text
        value: device
      - name: client_id
        type: text
        value: "{{clientId}}"
      - name: format
        type: text
        value: json
      - name: code
        type: text
        value: "{{_deviceCode}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();
        const context = bru.getEnvName() ? { set: (k, v) => bru.setEnvVar(k, v), get: (k) => bru.getEnvVar(k) } : { set: (k, v) => bru.setVar(k, v), get: (k) => bru.getVar(k) };
        context.set("_refreshToken", jsonData.refresh_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Device Flow 2
    request:
      url: "{{url}}{{site}}/services/oauth2/token"
      method: POST
      body:
        type: multipart-form
        data:
          - name: grant_type
            type: text
            value: device
          - name: client_id
            type: text
            value: "{{clientId}}"
          - name: format
            type: text
            value: json
          - name: code
            type: text
            value: M01WRzlWZS4yd3FVVnhfYWxmS2xQUmdzMHlZM3ozUnZHelJIQXVFZzl5dlpubWRfR05LcGtybVNEODBTTDg1Z0lsWG1hR29WUFZ5ZWtkaFZWZnJVdzs4NS4yMjIuMTM0LjQ7MTcwMDE0ODU3OTk1NjsxMlpIR01aSA
