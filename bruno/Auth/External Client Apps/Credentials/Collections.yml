info:
  name: Collections
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}{{site}}/services/data/v{{version}}/apps/oauth/credentials/{{_appId}}"
  headers:
    - name: Authorization
      value: Bearer <token>
      description: Replace <token> with your access token
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns credentials for all consumers associated with an external client app. See [OAuth Credentials by App ID](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_credentials_by_app_id.htm).
