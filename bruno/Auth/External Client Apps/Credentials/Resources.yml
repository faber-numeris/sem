info:
  name: Resources
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}{{site}}/services/data/v{{version}}/apps/oauth/credentials/{{_appId}}/{{_consumerId}}?part=Key"
  headers:
    - name: Authorization
      value: Bearer <token>
      description: Replace <token> with your access token
  params:
    - name: part
      value: Key
      type: query
      description: Key, Secret, or KeyAndSecret
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns credentials for a specific consumer. Use parameters to determine whether the request should return the key, the secret, or both key and secret. See [OAuth Credentials by Consumer ID](https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_credentials_by_app_and_consumer_id.htm).
