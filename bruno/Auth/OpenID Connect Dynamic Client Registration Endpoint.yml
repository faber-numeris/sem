info:
  name: OpenID Connect Dynamic Client Registration Endpoint
  type: http
  seq: 19

http:
  method: POST
  url: "{{url}}{{site}}/services/oauth2/register"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{init_access_token}}
  body:
    type: json
    data: |-
      {
          "redirect_uris": [
              "http://localhost"
          ],
          "response_types": [
              "code",
              "token",
              "id_token"
          ],
          "grant_types": [
              "authorization_code",
              "implicit",
              "refresh_token"
          ],
          "application_type": "web",
          "contacts": [
              "abc@sf.com",
              "ve7jtb@example.org"
          ],
          "client_name": "Example Olivier"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful OpenID Connect Dynamic Client Registration Endpoint
    request:
      url: "{{url}}{{site}}/services/oauth2/register"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer {{init_access_token}}
      body:
        type: json
        data: |-
          {
              "redirect_uris": [
                  "http://localhost"
              ],
              "response_types": [
                  "code",
                  "token",
                  "id_token"
              ],
              "grant_types": [
                  "authorization_code",
