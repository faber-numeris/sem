info:
  name: List View Results
  type: http
  seq: 3

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/sobjects/:SOBJECT_API_NAME/listviews/:LIST_VIEW_ID/results"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: limit
      value: ""
      type: query
      description: The maximum number of records to return, between 1-2000. The default value is 25.
      disabled: true
    - name: offset
      value: ""
      type: query
      description: The first record to return. Use this parameter to paginate the results. The default value is 1.
      disabled: true
    - name: SOBJECT_API_NAME
      value: ""
      type: path
    - name: LIST_VIEW_ID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns detailed information about a list view, including the ID, the columns, and the SOQL query.
