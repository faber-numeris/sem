info:
  name: List Views
  type: http
  seq: 1

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/sobjects/:SOBJECT_API_NAME/listviews/"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: limit
      value: ""
      type: query
      description: The maximum number of records to return, between 1-2000. The default value is 25.
      disabled: true
    - name: offset
      value: ""
      type: query
      description: The first record to return. Use this parameter to paginate the results. The default value is 1.
      disabled: true
    - name: SOBJECT_API_NAME
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns the list of list views for the specified sObject, including the ID and other basic information about each list view. You can also get basic information for a specific list view by ID.
