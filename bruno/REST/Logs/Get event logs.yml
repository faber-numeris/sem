info:
  name: Get event logs
  type: http
  seq: 1

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/query/?q=SELECT+FIELDS(ALL)+from+EventLogFile+ORDER+BY+LastModifiedDate+DESC+LIMIT+200"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: q
      value: SELECT+FIELDS(ALL)+from+EventLogFile+ORDER+BY+LastModifiedDate+DESC+LIMIT+200
      type: query
      description: Gets the first 200 EventLogFile records ordered by most recently updated first.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Executes the specified SOQL query.

  If the query results are too large, the response contains the first batch of results and a query identifier in the nextRecordsUrl field of the response. The identifier can be used in an additional request to retrieve the next batch.
  https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_query.htm
