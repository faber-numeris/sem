info:
  name: SObject Blob Retrieve
  type: http
  seq: 13

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/sobjects/:SOBJECT_API_NAME/:RECORD_ID/:BLOB_FIELD"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: SOBJECT_API_NAME
      value: ""
      type: path
    - name: RECORD_ID
      value: ""
      type: path
    - name: BLOB_FIELD
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Retrieves the specified blob field from an individual record.
