info:
  name: Search
  type: http
  seq: 1

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/search?q="
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: q
      value: ""
      type: query
      description: A SOSL statement that is properly URL-encoded.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Executes the specified SOSL search. The search string must be URL-encoded.

  https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_search.htm
