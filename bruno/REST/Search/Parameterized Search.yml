info:
  name: Parameterized Search
  type: http
  seq: 7

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/parameterizedSearch/?q="
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: q
      value: ""
      type: query
      description: A search string that is properly URL-encoded
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Executes a simple RESTful search using parameters instead of a SOSL clause. Indicate parameters in a URL in the GET method. Or, use POST for more complex JSON searches.
