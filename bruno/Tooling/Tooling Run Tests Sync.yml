info:
  name: Tooling Run Tests Sync
  type: http
  seq: 6

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/tooling/runTestsSynchronous"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      [
          {
              "className": "YourClassName",
              "testMethods": [
                  "testMethod1",
                  "testMethod2",
                  "testMethod3"
              ]
          },
          {
              "maxFailedTests": "2"
          }
      ]

      or

      {
          "tests": [
              {
                  "className": "YourClassName",
                  "testMethods": [
                      "testMethod1",
                      "testMethod2",
                      "testMethod3"
                  ]
              }
          ],
          "maxFailedTests": "integer value",
          "testLevel": "TestLevel enum value",
          "skipCodeCoverage": "boolean value"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
