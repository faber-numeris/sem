                  "testMethod1",
                  "testMethod2",
                  "testMethod3"
              ]
          },
          {
              "maxFailedTests": "2"
          }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

