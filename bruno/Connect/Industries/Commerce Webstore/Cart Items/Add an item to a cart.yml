info:
  name: Add an item to a cart
  type: http
  seq: 1

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/commerce/webstores/{{webstoreId}}/carts/:webCartId/cart-items?effectiveAccountId=<EFFECTiVE_ACCOUNT_ID>"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: effectiveAccountId
      value: <EFFECTiVE_ACCOUNT_ID>
      type: query
    - name: webCartId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
          "productId":"<PRODUCT-ID>",
          "quantity":3,
          "type":"Product"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
