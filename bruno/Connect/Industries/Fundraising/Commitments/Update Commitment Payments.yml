info:
  name: Update Commitment Payments
  type: http
  seq: 4

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/connect/fundraising/commitments/payment-updates"
  body:
    type: json
    data: |-
      {
        "updates": [
          {
            "giftCommitmentId": "<SFDC_GIFT_COMMITMENT_ID>",
            "paymentInstrument": {
              "type": "credit card",
              "accountHolderName": "test donor 1",
              "expiryMonth": "10",
              "expiryYear": "2026",
              "last4": "4585",
              "cardBrand": "visa",
              "bankName": "chase",
              "digitalWalletProvider": "apple pay",
              "bankAccountHolderType": "primary",
              "bankAccountType": "checking",
              "bankAccountNumber": "123456",
              "bankCode": "HBUK",
              "gatewayName": "stripe",
              "processorName": "classy",
              "processorPaymentReference": "string",
              "gatewayReference": "string"
            }
          },
          {
            "giftCommitmentId": "<SFDC_GIFT_COMMITMENT_ID>",
            "paymentInstrument": {
              "type": "credit card",
              "accountHolderName": "test donor 2",
              "expiryMonth": "10",
              "expiryYear": "2026",
              "last4": "4585",
              "cardBrand": "visa",
              "bankName": "chase",
              "digitalWalletProvider": "apple pay",
              "bankAccountHolderType": "primary",
              "bankAccountType": "checking",
              "bankAccountNumber": "123456",
              "bankCode": "HBUK",
              "gatewayName": "stripe",
              "processorName": "test processor",
              "processorPaymentReference": "string",
              "gatewayReference": "string"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

