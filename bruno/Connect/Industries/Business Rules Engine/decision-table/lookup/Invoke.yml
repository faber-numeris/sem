info:
  name: Invoke
  type: http
  seq: 1

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/connect/business-rules/decision-table/lookup/:decisionTableId"
  params:
    - name: decisionTableId
      value: 0lDHo0000008Po3
      type: path
      description: Decision Table Id
  body:
    type: json
    data: |-
      {
          "datasetLinkName": "transactionMapping",
          "conditions": [
              {
                  "conditionsList": [
                      {
                          "fieldName": "Product__c",
                          "value": "Nike",
                          "operator": "Matches" //Operator is optional
                      },
                      {
                          "fieldName": "Price__c",
                          "value": 1000,
                          "operator": "GreaterThan"
                      }
                  ]
              },
              {
                  "conditionsList": [
                      {
                          "fieldName": "Product__c",
                          "value": "Adidas",
                          "operator": "Matches" //Operator is optional
                      },
                      {
                          "fieldName": "Price__c",
                          "value": 1500,
                          "operator": "GreaterThan"
                      }
                  ]
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

