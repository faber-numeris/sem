info:
  name: List Named Credentials
  type: http
  seq: 3

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/named-credential-setup"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful List Named Credentials
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/named-credential-setup"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 20 Nov 2023 16:45:55 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Vary
          value: Accept-Encoding
        - name: Content-Encoding
          value: gzip
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          {
              "namedCredentials": [
                  {
                      "calloutUrl": "https://my.example.com",
                      "developerName": "Test",
                      "id": "0XA...",
