info:
  name: Update Credential
  type: http
  seq: 9

http:
  method: PUT
  url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential"
  body:
    type: json
    data: |-
      {
          "externalCredential": "test",
          "authenticationProtocol": "Custom",
          "principalName": "test",
          "principalType": "NamedPrincipal",
          "credentials": {
              "testCredential": {
                  "value": "000000",
                  "encrypted": true
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update a credential.
