info:
  name: Delete Credential
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential"
  body:
    type: json
    data: |-
      {
          "externalCredential": "SampleExternalCredential",
          "principalType": "NamedPrincipal",
          "principalName": "SamplePrincipal"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Delete a credential.
