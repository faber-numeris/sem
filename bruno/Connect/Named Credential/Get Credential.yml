info:
  name: Get Credential
  type: http
  seq: 1

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential?externalCredential=&principalName=&principalType="
  params:
    - name: externalCredential
      value: ""
      type: query
      description: Fully qualified developer name of the external credential.
    - name: principalName
      value: ""
      type: query
      description: Name of the external credential named principal.
    - name: principalType
      value: ""
      type: query
      description: |-
        Type of credential principal. Values are:
        * AwsStsPrincipal
        * NamedPrincipal
        * PerUserPrincipal
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Get Credential
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential?externalCredential=Test&principalName=Test&principalType=NamedPrincipal"
      method: GET
      params:
        - name: externalCredential
          value: Test
          type: query
          description: Fully qualified developer name of the external credential.
        - name: principalName
          value: Test
          type: query
          description: Name of the external credential named principal.
        - name: principalType
          value: NamedPrincipal
          type: query
          description: |-
            Type of credential principal. Values are:
            * AwsStsPrincipal
            * NamedPrincipal
            * PerUserPrincipal
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 22 Nov 2023 12:01:04 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Vary
          value: Accept-Encoding
        - name: Content-Encoding
          value: gzip
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          {
              "authenticationProtocol": "Custom",
              "authenticationProtocolVariant": "NoAuthentication",
              "authenticationStatus": "Configured",
              "credentials": {},
              "externalCredential": "Test",
              "principalName": "Test",
              "principalType": "NamedPrincipal"
          }

docs: Get a credential.
