info:
  name: Get Named Credential by Developer Name
  type: http
  seq: 5

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/named-credential-setup/:DEVELOPER_NAME"
  params:
    - name: DEVELOPER_NAME
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

