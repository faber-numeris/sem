info:
  name: Files Shares Link
  type: http
  seq: 6

http:
  method: PUT
  url: "{{_endpoint}}/services/data/v{{version}}/connect/files/:FILE_ID/file-shares/link"
  params:
    - name: FILE_ID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Files Shares Link
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/connect/files/:FILE_ID/file-shares/link"
      method: PUT
      params:
        - name: FILE_ID
          value: 0692o00000woaRkAAI
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 20 Nov 2023 16:38:31 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          {
              "expirationDate": null,
              "fileViewUrl": "https://<my_domain>/sfc/p/2o000000i6mB/a/2o00000022S3/y2zsu9pHtEVIa49w6ElaXdjXz_GxBSzRVwe645_Z.dw",
              "isPasswordRequired": false,
              "password": null,
              "sharingType": "V"
          }

docs: |-
  A description of a file shared as a link. Create, access, and delete a file’s share link.

