info:
  name: File Shares
  type: http
  seq: 5

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/connect/files/:FILE_ID/file-shares"
  params:
    - name: FILE_ID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

