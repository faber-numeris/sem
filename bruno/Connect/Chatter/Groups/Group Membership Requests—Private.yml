info:
  name: Group Membership Requests—Private
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{_endpoint}}/services/data/v{{version}}/chatter/group-membership-requests/:CHATTER_GROUP_REQUEST_ID?status=Accepted&responseMessage=Welcome to the group!"
  params:
    - name: status
      value: Accepted
      type: query
    - name: responseMessage
      value: Welcome to the group!
      type: query
    - name: CHATTER_GROUP_REQUEST_ID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

