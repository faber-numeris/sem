info:
  name: Group Members—Private
  type: http
  seq: 2

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/chatter/groups/:GROUP_ID/members/requests"
  params:
    - name: status
      value: Accepted
      type: query
      description: |-
        Optional. If you include this parameter, results are filtered to include those that match the specified status. Valid values:
        Accepted
        Declined
        Pending
      disabled: true
    - name: GROUP_ID
      value: 0F9...
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

