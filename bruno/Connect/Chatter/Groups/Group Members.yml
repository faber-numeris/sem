  url: "{{_endpoint}}/services/data/v{{version}}/chatter/groups/:GROUP_ID/members?userId=<USER1_ID>"
  params:
    - name: userId
      value: <USER1_ID>
      type: query
    - name: GROUP_ID
      value: ""
      type: path
  auth: inherit

