info:
  name: Comment - Edit
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{_endpoint}}/services/data/v{{version}}/chatter/comments/:COMMENT_ID"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: COMMENT_ID
      value: 0D7...
      type: path
  body:
    type: json
    data: |-
      {
          "body": {
              "messageSegments": [
                  {
                      "type": "Text",
                      "text": "Editing a comment"
                  }
              ]
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

