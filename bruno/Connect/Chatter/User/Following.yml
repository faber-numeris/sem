info:
  name: Following
  type: http
  seq: 3

http:
  method: GET
  url: "{{_endpoint}}/services/data/v{{version}}/chatter/users/:USER_ID/following"
  params:
    - name: filterType
      value: ""
      type: query
      description: Specifies the key prefix to filter the type of objects returned. The key prefix is the three-character prefix code in the object ID. Object IDs are prefixed with three-character codes that specify the type of the object. For example, User objects have a prefix of 005 and Group objects have a prefix of 0F9.
      disabled: true
    - name: page
      value: ""
      type: query
      description: Specifies the page number to return. The default value is 0, which returns the first page.
      disabled: true
    - name: pageSize
      value: ""
      type: query
      description: |
        Specifies the number of items per page. Valid values are between 1 and 1000. If you don't specify a size, the default is 25.
      disabled: true
    - name: USER_ID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Following
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/chatter/users/:USER_ID/following"
      method: GET
      params:
        - name: filterType
          value: ""
          type: query
          description: Specifies the key prefix to filter the type of objects returned. The key prefix is the three-character prefix code in the object ID. Object IDs are prefixed with three-character codes that specify the type of the object. For example, User objects have a prefix of 005 and Group objects have a prefix of 0F9.
          disabled: true
        - name: page
          value: ""
          type: query
          description: Specifies the page number to return. The default value is 0, which returns the first page.
          disabled: true
        - name: pageSize
          value: ""
          type: query
          description: |
            Specifies the number of items per page. Valid values are between 1 and 1000. If you don't specify a size, the default is 25.
          disabled: true
        - name: USER_ID
          value: 0052o00000DKQasAAH
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 20 Nov 2023 16:25:01 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Vary
          value: Accept-Encoding
        - name: Content-Encoding
          value: gzip
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          {
              "currentPageUrl": "/services/data/v58.0/chatter/users/0052o00000DKQasAAH/following",
              "following": [],
              "nextPageUrl": null,
              "previousPageUrl": null,
              "total": 0
          }

docs: |-
  Returns a list of people, groups, records, topics, and files that the specified user is following. Also used to follow records.

  https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resources_users_FollowingUsers.htm?search_text=following
