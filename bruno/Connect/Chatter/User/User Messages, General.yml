info:
  name: User Messages, General
  type: http
  seq: 2

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/chatter/users/me/messages?text=This is a private message&recipients=<USER1_ID>,<USER2_ID>"
  params:
    - name: text
      value: This is a private message
      type: query
    - name: inReplyTo
      value: <MESSAGE_ID>
      type: query
      description: ID of an existing message that identifies which conversation this message is part of. Specify either recipients or inReplyTo. Specify one or the other, not both.
      disabled: true
    - name: recipients
      value: <USER1_ID>,<USER2_ID>
      type: query
      description: Comma-separated list of User IDs
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful User Messages, General
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/chatter/users/me/messages?text=This is a private message&recipients=0052o00000DKQasAAH"
      method: POST
      params:
        - name: text
          value: This is a private message
          type: query
        - name: inReplyTo
          value: <MESSAGE_ID>
          type: query
          description: ID of an existing message that identifies which conversation this message is part of. Specify either recipients or inReplyTo. Specify one or the other, not both.
          disabled: true
        - name: recipients
          value: 0052o00000DKQasAAH
          type: query
          description: Comma-separated list of User IDs
      body:
        type: text
        data: ""
