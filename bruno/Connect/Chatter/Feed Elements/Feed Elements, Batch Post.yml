info:
  name: Feed Elements, Batch Post
  type: http
  seq: 3

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/chatter/feed-elements/batch"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "inputs": [
              {
                  "richInput": {
                      "subjectId": "<USER_GROUP_RECORD_ID>",
                      "body": {
                          "messageSegments": [
                              {
                                  "type": "Text",
                                  "text": "Post Number 1"
                              }
                          ]
                      },
                      "capabilities": {
                          "files": {
                              "items": [
                                  {
                                      "id": "<FILE_ID>"
                                  }
                              ]
                          }
                      },
                      "feedElementType": "FeedItem"
                  }
              },
              {
                  "richInput": {
                      "subjectId": "<USER_GROUP_RECORD_ID>",
                      "body": {
                          "messageSegments": [
                              {
                                  "type": "Text",
                                  "text": "Post Number 2"
                              }
                          ]
                      },
                      "feedElementType": "FeedItem"
                  }
              },
              {
                  "richInput": {
                      "subjectId": "me",
                      "body": {
                          "messageSegments": [
                              {
                                  "type": "Text",
                                  "text": "Post Number 3 with Inline"
                              },
                              {
                                  "type": "InlineImage",
                                  "fileId": "<FILE_ID>",
                                  "altText": "Test Inline"
                              }
                          ]
                      },
                      "feedElementType": "FeedItem"
                  }
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

