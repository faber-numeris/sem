info:
  name: SObject Collections Upsert
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{_endpoint}}/services/data/v{{version}}/composite/sobjects/:SOBJECT_API_NAME/:FIELD_NAME"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: SOBJECT_API_NAME
      value: Account
      type: path
    - name: FIELD_NAME
      value: Id
      type: path
  body:
    type: json
    data: |+
      {
          "allOrNone" : false,
          "records" : [{
              "attributes" : {"type" : "Account"},
              "Name" : "Test Upsert",
              "Id" : "0012o00003OBzVSAA1"
          }]
      }


  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful SObject Collections Upsert
    request:
      url: "{{_endpoint}}/services/data/v{{version}}/composite/sobjects/:SOBJECT_API_NAME/:FIELD_NAME"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      params:
        - name: SOBJECT_API_NAME
          value: Account
          type: path
        - name: FIELD_NAME
          value: Id
          type: path
      body:
        type: json
        data: |+
          {
              "allOrNone" : false,
              "records" : [{
                  "attributes" : {"type" : "Account"},
                  "Name" : "Test Upsert",
                  "Id" : "0012o00003OBzVSAA1"
              }]
          }


    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 20 Nov 2023 15:29:54 GMT
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Robots-Tag
          value: none
        - name: Cache-Control
          value: no-cache,must-revalidate,max-age=0,no-store,private
        - name: Sforce-Limit-Info
          value: api-usage=48/15000
        - name: Content-Type
          value: application/json;charset=UTF-8
        - name: Transfer-Encoding
          value: chunked
      body:
        type: json
        data: |-
          [
              {
