info:
  name: Delete Account
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  headers:
    - name: X-Chatter-Entity-Encoding
      value: "false"
  body:
    query: |-
      mutation AccountDeleteExample{
        uiapi {
          AccountDelete(input: {
            Id: "<Id>"
          })
            {
               Id
            }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
