info:
  name: Update Account
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  headers:
    - name: X-Chatter-Entity-Encoding
      value: "false"
  body:
    query: |-
      mutation AccountUpdateExample{
        uiapi {
          AccountUpdate(input: {
            Account: {
              Name: "Smith"
            }
            Id: "<Id>"
          })
            {
              success
            }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
