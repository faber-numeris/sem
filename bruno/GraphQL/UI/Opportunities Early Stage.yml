info:
  name: Opportunities Early Stage
  type: graphql
  seq: 10

graphql:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  headers:
    - name: X-Chatter-Entity-Encoding
      value: "false"
  body:
    query: |-
      query opportunitiesClosed {
        uiapi {
          query {
            Opportunity(
              where: {
                or: [
                  { StageName: { eq: "Prospecting" } }
                  { StageName: { eq: "Needs Analysis" } }
                ]
              }
            ) {
              edges {
                node {
                  Id
                  Name {
                    value
                  }
                  CloseDate {
                    value
                    displayValue
                  }
                  Description {
                    value
                  }
                  StageName {
                    value
                  }
                }
              }
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
