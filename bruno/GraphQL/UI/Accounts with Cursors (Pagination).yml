info:
  name: Accounts with Cursors (Pagination)
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  headers:
    - name: X-Chatter-Entity-Encoding
      value: "false"
  body:
    query: |-
      query accountsWithCursors($first: Int, $after: String) {
        uiapi {
          query {
            Account(first: $first, after: $after) {
              edges {
                node {
                  Id
                  Name {
                    value
                  }
                }
              }
              totalCount
              pageInfo {
                hasNextPage
                hasPreviousPage
                startCursor
                endCursor
              }
            }
          }
        }
      }
    variables: |-
      {
          "first": 3,
          "after": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
