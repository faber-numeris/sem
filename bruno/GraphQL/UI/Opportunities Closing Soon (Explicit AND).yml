info:
  name: Opportunities Closing Soon (Explicit AND)
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  headers:
    - name: X-Chatter-Entity-Encoding
      value: "false"
  body:
    query: |-
      query opportunitiesClosingSoonExplicitAND($month: Long) {
        uiapi {
          query {
            Opportunity(
              where: {
                and: [
                  { StageName: { eq: "Negotiation/Review" } }
                  { CloseDate: { CALENDAR_MONTH: { value: { eq: $month } } } }
                ]
              }
            ) {
              edges {
                node {
                  Id
                  Name {
                    value
                  }
                  StageName {
                    value
                  }
                  CloseDate {
                    value
                    displayValue
                  }
                  Description {
                    value
                  }
                }
              }
            }
          }
        }
      }
    variables: |-
      {
          "month": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
