info:
  name: 05 OAuth Token Introspect
  type: http
  seq: 5

http:
  method: POST
  url: "{{_endpoint}}/services/oauth2/introspect"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: token
        value: "{{_accessToken}}"
      - name: token_type_hint
        value: access_token
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Token introspection returns active true", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().active).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
