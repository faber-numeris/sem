info:
  name: 03 OAuth Token Client Credentials
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/services/oauth2/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("_accessToken", body.access_token);
    - type: tests
      code: |-
        test("Token issued for client_credentials", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().access_token).to.be.a("string");
          expect(res.getBody().token_type).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
