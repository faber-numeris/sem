info:
  name: 13 Create Record Account
  type: http
  seq: 13

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/sobjects/Account/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "Name": "Bruno Integration Account",
        "Industry": "Technology",
        "AccountNumber": "BRUNO-100"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("accountId", res.getBody().id);
    - type: tests
      code: |-
        test("Creates Account and returns 201 with id", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().success).to.equal(true);
          expect(res.getBody().id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
