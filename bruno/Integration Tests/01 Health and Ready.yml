info:
  name: 01 Health and Ready
  type: http
  seq: 1

http:
  method: GET
  url: "{{_endpoint}}/ready"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Ready status is 200", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("READY");
        });

settings:
  encodeUrl: true
  timeout: 0
