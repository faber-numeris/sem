info:
  name: 04 OAuth Token Password Flow
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/services/oauth2/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("tempToken", res.getBody().access_token);
    - type: tests
      code: |-
        test("Token issued for password grant", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
