info:
  name: Update named credential
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{_endpoint}}/services/data/v{{version}}/tooling/sobjects/NamedCredential/:NAMED_CREDENTIAL_ID"
  params:
    - name: NAMED_CREDENTIAL_ID
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
          "FullName": "MyNamedCredential",
          "Metadata": {
              "label": "My Named Credential",
              "endpoint" : "arn:aws:AWS_REGION:AWS_ACCOUNT_ID",
              "principalType" : "Anonymous",
              "protocol": "NoAuthentication" 
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
