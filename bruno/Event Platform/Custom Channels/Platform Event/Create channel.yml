info:
  name: Create channel
  type: http
  seq: 1

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/tooling/sobjects/PlatformEventChannel"
  headers:
    - name: Content-Type
      value: application/json
    - name: SOAPAction
      value: '""'
    - name: Authorization
      value: Bearer {{_accessToken}}
  body:
    type: json
    data: |-
      {
          "FullName": "Carbon_Comparison_Channel__chn",
          "Metadata": {
              "channelType": "event",
              "label": "Carbon Comparison Channel",
              "urls": null
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
