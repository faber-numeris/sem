info:
  name: Bulk Close Job
  type: http
  seq: 5

http:
  method: POST
  url: "{{_endpoint}}/services/async/{{version}}/job/{{_jobId}}"
  headers:
    - name: X-SFDC-Session
      value: "{{_accessToken}}"
    - name: Content-Type
      value: application/json
    - name: charset
      value: UTF-8
    - name: Accept-Encoding
      value: gzip
      disabled: true
    - name: Content-Encoding
      value: gzip
      disabled: true
  body:
    type: json
    data: |-
      {
         "state" : "Closed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
