info:
  name: Bulk Create Job
  type: http
  seq: 2

http:
  method: POST
  url: "{{_endpoint}}/services/async/{{version}}/job"
  headers:
    - name: X-SFDC-Session
      value: "{{_accessToken}}"
    - name: Content-Type
      value: application/json
    - name: charset
      value: UTF-8
    - name: Sforce-Disable-Batch-Retry
      value: "FALSE"
      disabled: true
    - name: Sforce-Line-Ending
      value: CRLF
      disabled: true
    - name: Sforce-Enable-PKChunking
      value: "FALSE"
      disabled: true
    - name: chunkSize
      value: "10000"
      disabled: true
    - name: Accept-Encoding
      value: gzip
      disabled: true
    - name: Content-Encoding
      value: gzip
      disabled: true
  body:
    type: json
    data: |-
      {
          "operation": "insert",
          "object": "Account",
          "contentType": "CSV"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const context = bru.getEnvName() ? { set: (k, v) => bru.setEnvVar(k, v), get: (k) => bru.getEnvVar(k) } : { set: (k, v) => bru.setVar(k, v), get: (k) => bru.getVar(k) };

        const contentType = res.getHeader("Content-Type");
        if (contentType.indexOf("xml") !== -1) {
            const jsonData = xml2Json(JSON.stringify(res.getBody()));
            context.set("_jobId", jsonData['jobInfo']['id']);    
        }
        else if (contentType.indexOf("json") !== -1) {
            const jsonData = res.getBody();
            context.set("_jobId", jsonData.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Successful Bulk Create Job
    request:
      url: "{{_endpoint}}/services/async/{{version}}/job"
