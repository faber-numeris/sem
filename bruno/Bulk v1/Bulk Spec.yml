info:
  name: Bulk Spec
  type: http
  seq: 3

http:
  method: POST
  url: "{{_endpoint}}/services/async/{{version}}/job/{{_jobId}}/spec"
  headers:
    - name: X-SFDC-Session
      value: "{{_accessToken}}"
    - name: Content-Type
      value: text/csv
    - name: charset
      value: UTF-8
    - name: Accept-Encoding
      value: gzip
    - name: Content-Encoding
      value: gzip
  body:
    type: text
    data: |-
      Salesforce Field,Csv Header,Value,Hint
      Name,Full Name,,
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

