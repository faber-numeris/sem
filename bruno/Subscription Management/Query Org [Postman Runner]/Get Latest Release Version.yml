info:
  name: Get Latest Release Version
  type: http
  seq: 2

http:
  method: GET
  url: "{{_endpoint}}/services/data/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const context = bru.getEnvName() ? { set: (k, v) => bru.setEnvVar(k, v), get: (k) => bru.getEnvVar(k) } : { set: (k, v) => bru.setVar(k, v), get: (k) => bru.getVar(k) };

        const statusCode = res.getStatus();
        tests["Response code - Expected: 200 & Actual: " + statusCode] = statusCode == 200;
        if(statusCode == 200){
            const jsonData = res.getBody();
            context.set("version", jsonData[jsonData.length-1].version);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
