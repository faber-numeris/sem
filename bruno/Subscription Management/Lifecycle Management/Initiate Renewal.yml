info:
  name: Initiate Renewal
  type: http
  seq: 3

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/asset-management/assets/collection/actions/initiate-renewal"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "assetIds": {
          "assetIdArray": [
            "{{assetID}}"
          ]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
