info:
  name: Initiate Amend Quantity
  type: http
  seq: 4

http:
  method: POST
  url: "{{_endpoint}}/services/data/v{{version}}/asset-management/assets/collection/actions/initiate-amend-quantity"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "assetIds": {
          "assetIdArray": [
            "{{assetID}}"
          ]
        },
        "startDate": "2023-08-18T00:00:00",
        "quantityChange": 5,
        "amendmentOutputType": "order"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
