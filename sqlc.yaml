version: "2"
sql:
  - schema: "internal/adapters/outbound/postgres/migrations"
    queries: "internal/adapters/outbound/postgres/queries"
    engine: "postgresql"
    gen:
      go:
        package: "gen"
        out: "internal/adapters/outbound/postgres/gen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.varchar"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.varchar"
            go_type: "string"
            nullable: false
          - db_type: "text"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "text"
            go_type: "string"
            nullable: false
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
            nullable: false
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
            nullable: false
          - db_type: "pg_catalog.int4"
            go_type:
              type: "int"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.int4"
            go_type: "int"
            nullable: false
          - db_type: "pg_catalog.int8"
            go_type:
              type: "int64"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.int8"
            go_type: "int64"
            nullable: false
          - db_type: "pg_catalog.float8"
            go_type:
              type: "float64"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.float8"
            go_type: "float64"
            nullable: false
          - db_type: "pg_catalog.bool"
            go_type:
              type: "bool"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.bool"
            go_type: "bool"
            nullable: false
          - db_type: "bool"
            go_type:
              type: "bool"
              pointer: true
            nullable: true
          - db_type: "bool"
            go_type: "bool"
            nullable: false
